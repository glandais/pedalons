    path:
      en: /teams/{teamSlug}
      fr: /equipes/{teamSlug}
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true
  - id: teamAbout
    path:
      en: /teams/{teamSlug}/about
      fr: /equipes/{teamSlug}/a-propos
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true
  - id: teamCalendar
    path:
      en: /teams/{teamSlug}/calendar
      fr: /equipes/{teamSlug}/calendrier
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true
  # The team's « Agenda » — its rides and trips, upcoming first — and its « Publications », the
  # posts alone, newest first (docs/LEDGER_*.md WEB-68, plan docs/plans/archive/2026-10-06-team-agenda.md
  # §5). The agenda is the ancestor of a ride's and a trip's page, the posts list of a post's:
  # `articles`, not `publications`, because it is the parent of the existing post addresses — the
  # lexicon rules the displayed text, not the URLs. `teamCalendar` above is the agenda's calendar
  # view.
  - id: teamAgenda
    path:
      en: /teams/{teamSlug}/agenda
      fr: /equipes/{teamSlug}/agenda
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true
  - id: teamPosts
    path:
      en: /teams/{teamSlug}/posts
      fr: /equipes/{teamSlug}/articles
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true
  # The former « Sorties » and « Voyages » tabs (WEB-64), kept for the links already out there: the
  # site redirects them to the agenda (`teamAgenda`, `teamAgenda?type=trip`). `mobile` + `deeplink`
  # because the team's deeplink patterns (`/equipes/*` in the AASA, `/equipes/.*` in the manifest)
  # catch these paths whatever this file says, so `web` alone would open the app on its 404.
  - id: teamRides
    path:
      en: /teams/{teamSlug}/rides
      fr: /equipes/{teamSlug}/sorties
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true
  - id: teamTrips
    path:
      en: /teams/{teamSlug}/trips
      fr: /equipes/{teamSlug}/voyages
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true

  # Member list of a team, shown to regular (non-admin) members. Distinct
  # from `teamAdminMembers`, which is the admin screen under /admin/members.
  # Who may read it is graded server-side (docs/LEDGER_*.md API-39).
  - id: teamMembers
    path:
      en: /teams/{teamSlug}/members
      fr: /equipes/{teamSlug}/membres
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true

  # --- Team pages (segment "pages" is already French) ---
  - id: teamPage
    path:
      en: /teams/{teamSlug}/pages/{pageSlug}
      fr: /equipes/{teamSlug}/pages/{pageSlug}
    params:
      - teamSlug
      - pageSlug
    web: true
    mobile: true

  # --- Team admin ---
