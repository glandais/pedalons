  - id: rideTemplates
    path:
      en: /teams/{teamSlug}/admin/ride-templates
      fr: /equipes/{teamSlug}/admin/modeles-sortie
    params:
      - teamSlug
    web: true
    mobile: true
    deeplink: true
  - id: rideTemplateNew
    path:
      en: /teams/{teamSlug}/admin/ride-templates/new
      fr: /equipes/{teamSlug}/admin/modeles-sortie/nouveau
    params:
      - teamSlug
    web: true
    mobile: true
