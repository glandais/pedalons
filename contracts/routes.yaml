# UI routes source of truth.
# Generator: scripts/generate-routes.mjs
# Outputs:
#   - frontend/src/config/paths.generated.ts
#   - mobile/lib/config/paths.generated.dart
#   - mobile/android/app/src/main/AndroidManifest.xml (deeplink section between markers)
#   - frontend/public/.well-known/apple-app-site-association
#
# Fields:
#   id:         unique camelCase identifier, becomes the builder function name
#   path:       string "/..." (shorthand for {en: "/..."}) or map {locale: "/..."}
#   params:     list of parameter names — must appear as {name} in every locale path
#   web:        emit a builder in paths.generated.ts (default: true)
#   mobile:     emit a builder in paths.generated.dart (default: false)
#   mobileName: optional override for the mobile builder name (default: id)
#   appScreen:  false for a web route with `mobile: true` the app has no screen for — the Dart
#               builder only serves to open the page in a browser (`openWebPage`), and its name is
#               listed in `webOnlyRouteIds` so the app's link resolver never pushes it on its
#               router (default: true). Cannot be combined with `deeplink: true`.
#   deeplink:   register this path in AASA + AndroidManifest (default: false)
#   webFallback: for a deeplink with web: false, the id of the web route a browser is redirected
#               to — the universal link reaches the web whenever the app is not installed, and
#               must not end on a 404. Its params must be a subset of this route's.
#
# Every route must define `en`. `fr` is optional; if absent, routers only register `en`.
# When `en` and `fr` resolve to the same URL, the deeplink section dedupes automatically.

routes:
  # --- Root / misc ---
  - id: home
    path:
      en: /
      fr: /
    web: true
    mobile: true
    deeplink: true

  # --- Auth ---
  - id: login
    path:
      en: /login
      fr: /connexion
    web: true
    mobile: true
    deeplink: true
  - id: register
    path:
      en: /register
      fr: /inscription
    web: false
    mobile: true
    deeplink: true
    webFallback: login
  - id: verifyEmail
    path:
      en: /verify-email
      fr: /verifier-email
    web: true
    mobile: true
    deeplink: true
  # Where an invitation e-mail lands. The token travels in ?token=, like verifyEmail and
  # resetPassword: a bearer secret in a path segment ends up in access logs and in the Referer of
  # anything the page loads.
  #
  # mobile/deeplink stay false until there is a Flutter screen to receive it — turning deeplink on
  # first would make an installed app swallow the link and drop it nowhere. Flip both in the same
  # commit as that screen.
  - id: invitation
    path:
      en: /invitation
      fr: /invitation
    web: true
    mobile: false
    deeplink: false
  # Where biketeam sends a team admin who asked to move their team here. The signed request travels
  # in ?request= ; it is not a credential on its own (confirming needs a session), see
  # docs/plans/2026-09-22-biketeam-live-migration.md.
  - id: biketeamMigration
    path:
      en: /biketeam-migration
      fr: /migration-biketeam
    web: true
    mobile: false
    deeplink: false
  - id: forgotPassword
    path:
      en: /forgot-password
      fr: /mot-de-passe-oublie
    web: true
    mobile: true
    deeplink: true
  - id: resetPassword
    path:
      en: /reset-password
      fr: /nouveau-mot-de-passe
    web: true
    mobile: true
    deeplink: true

  # --- Device verification (brand names kept as-is) ---
  - id: deviceVerifyGarmin
    path:
      en: /garmin
      fr: /garmin
    web: true
    mobile: true
    deeplink: true
  - id: deviceVerifyKaroo
    path:
      en: /karoo
      fr: /karoo
    web: true
    mobile: true
    deeplink: true
  # The Hammerhead step of a Karoo pairing alone — the fallback QR on the Karoo (ledger API-63).
  - id: deviceHammerhead
    path:
      en: /karoo/hammerhead
      fr: /karoo/hammerhead
    web: true
    mobile: true
    deeplink: true

  # --- Apps ---
  - id: apps
    path:
      en: /apps
      fr: /applications
    web: true
    mobile: true
    deeplink: true

  # --- Features ---
  # Marketing page, web only. `mobile: true` + `appScreen: false` only emit the Dart path builder:
  # the app's sign-in screen opens this page in a browser. No deeplink — the app has no such screen.
  - id: features
    path:
      en: /features
      fr: /fonctionnalites
    web: true
    mobile: true
    appScreen: false

  # --- Legal ---
  - id: privacy
    path:
      en: /privacy
      fr: /confidentialite
    web: true
    mobile: true
    deeplink: true
  - id: terms
    path:
      en: /terms
      fr: /cgu
    web: true
    mobile: true
    deeplink: true
  - id: support
    path:
      en: /support
      fr: /support
    web: true
    mobile: false
    deeplink: false

  # --- User tabs ---
  - id: profile
    path:
      en: /profile
      fr: /profil
    web: true
    mobile: true
    deeplink: true
  # The inbox of docs/plans/archive/2026-09-18-notifications.md, on both clients since phase 3.
  - id: notifications
    path:
      en: /notifications
      fr: /notifications
    web: true
    mobile: true
    deeplink: true
  # The profile's sub-pages (profile navigation redesign, 2026-10): the same tree, labels and
  # paths on both clients. /profile is the overview; each sub-page is one subject.
  # No /profile/rides any more (2026-10-20): the home page and the agenda's « Je participe »
  # already list the rides one is registered to.
  - id: profilePreferences
    path:
      en: /profile/preferences
      fr: /profil/preferences
    web: true
    mobile: true
    deeplink: true
  # Notification settings. The inbox (`notifications`) links here, and every e-mail footer too
  # (NotificationLinks.PREFERENCES_PATH in the backend).
  - id: profileNotifications
    path:
      en: /profile/notifications
      fr: /profil/notifications
    web: true
    mobile: true
    deeplink: true
  - id: profileDevices
    path:
      en: /profile/devices
      fr: /profil/appareils
    web: true
    mobile: true
    deeplink: true
  - id: profileSecurity
    path:
      en: /profile/security
      fr: /profil/securite
    web: true
    mobile: true
    deeplink: true
  - id: profilePrivacy
    path:
