      - pageSlug
    web: true
  # `mobile: true` + `appScreen: false` on the organizer's pages below: the app's team dashboard
  # opens them on the site (mobile/…/team_web_paths.dart, docs/LEDGER_*.md MOB-54).
  - id: teamAdminMembers
    path:
      en: /teams/{teamSlug}/admin/members
      fr: /equipes/{teamSlug}/admin/membres
    params:
      - teamSlug
    web: true
    mobile: true
    appScreen: false
  - id: teamAdminReports
    path:
      en: /teams/{teamSlug}/admin/reports
      fr: /equipes/{teamSlug}/admin/signalements
    params:
      - teamSlug
    web: true
    mobile: true
    appScreen: false
  - id: teamSettings
    path:
      en: /teams/{teamSlug}/admin/settings
      fr: /equipes/{teamSlug}/admin/parametres
    params:
      - teamSlug
    web: true
    mobile: true
    appScreen: false

