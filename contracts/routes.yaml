    params:
      - teamSlug
    web: true
  - id: teamAdminPageNew
    path:
      en: /teams/{teamSlug}/admin/pages/new
      fr: /equipes/{teamSlug}/admin/pages/nouvelle
    params:
      - teamSlug
    web: true
