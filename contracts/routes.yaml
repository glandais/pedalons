  # profilePrivacy.
  - id: blockedUsers
    path:
      en: /profile/privacy/blocked
      fr: /profil/vie-privee/bloques
    web: true
    mobile: true
    deeplink: true
  - id: profileAccount
    path:
      en: /profile/account
      fr: /profil/compte
    web: true
    mobile: true
    deeplink: true
  - id: profileHelp
    path:
      en: /profile/help
      fr: /profil/aide
    web: true
    mobile: true
    deeplink: true
  - id: calendar
    path:
      en: /calendar
      fr: /calendrier
    web: true
    mobile: true
    deeplink: true
  - id: allRoutes
    path:
      en: /routes
      fr: /parcours
    web: true
    mobile: true
    deeplink: false
  - id: allRoutesMap
    path:
      en: /routes/map
      fr: /parcours/carte
    web: true
    mobile: true
    deeplink: false

  # --- GPX tools ---
  - id: gpxTools
    path:
      en: /gpx-tools
      fr: /outils-gpx
    web: true
    mobile: false
    deeplink: false
  - id: gpxToolsList
    path:
      en: /gpx-tools/my-files
      fr: /outils-gpx/mes-fichiers
    web: true
    mobile: false
    deeplink: false
  - id: gpxToolsNew
    path:
      en: /gpx-tools/new
      fr: /outils-gpx/nouveau
    web: true
    mobile: false
    deeplink: false
  # Static segment sibling of {previewId}: React Router ranks it first, and a TSID is never "map".
  - id: gpxToolsBlankMap
    path:
      en: /gpx-tools/map
      fr: /outils-gpx/carte
    web: true
    mobile: false
