# Workstation-only overlay for docker-compose.yml. Never deployed: docker-compose.yml is the
# deployment file and stays free of dev tooling, so this one carries what only a laptop wants.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# A local .env sets COMPOSE_FILE to that pair, so plain `docker compose up -d` picks it up here and
# nowhere else — a deployed .env has no COMPOSE_FILE and reads docker-compose.yml alone.
#
# docker-compose.yml is written for `docker stack deploy` first, so this file also turns back what
# only Swarm wants — see 5. below. Five things a deployment does not want:
#
#   1. mailpit. No SQL client here: postgres is published on the loopback, so bring your own —
#      psql, pgAdmin, DBeaver, an IDE. See "Running SQL" in README.md.
#   2. tileserver, pulled from docker-compose.shared.yml with `extends`. A host runs that stack
#      once and shares it between every environment; a workstation has one environment, so it
#      runs one stack instead of two — and the `shared` network becomes an ordinary project
#      network (see the bottom of this file) instead of one that must exist beforehand. Routing
#      is not a container: the backend calls the Stadia Maps API with STADIAMAPS_API_KEY (.env).
#   3. the host ports `mvn quarkus:dev` and `pnpm dev` talk to. A deployed backend reaches every
#      service over the compose network and publishes none of them; the %dev profile runs outside
#      Docker and expects imgproxy on 38080, tileserver on 18080, MinIO on 9000
#      and SMTP on 1025, and postgres on POSTGRES_HOST_PORT.
#   4. an `app` profile on backend/frontend/traefik, so that a plain `up` starts the backing services
#      alone — see the comment on those three below — and an `analytics` profile on goatcounter,
#      which nothing enables: the web analytics run in production only.
#   5. what Swarm needs and compose cannot use: traefik's Swarm provider becomes the Docker one, its
#      port goes back to the loopback, and the overlay network becomes a bridge.
services:
  # The stack runs the %prod Quarkus profile, whose only way out for mail is the SMTP relay named by
  # QUARKUS_MAILER_*. The local .env points it here, and it goes no further.
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: ${ENV_NAME}-mailpit
    restart: unless-stopped
    networks:
      - pedalons
    ports:
      - "127.0.0.1:1025:1025" # SMTP, for the backend in dev mode
      - "127.0.0.1:8025:8025" # Web UI

  # Image, volumes and memory limit come from the shared file — only the container name and the
  # published port are ours.
  tileserver:
    extends:
      file: docker-compose.shared.yml
      service: tileserver
    container_name: ${ENV_NAME}-tileserver
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"

  # On a deployed host these three are the point of the stack and always start. On a workstation the
  # common case is the opposite — `mvn quarkus:dev` and `pnpm dev` replace them, and want only the
  # services below — so here they move behind a profile. `docker compose up -d` then brings up the
  # backing services alone, and the full stack needs the profile named:
  #
  #   docker compose --profile app up -d          # or COMPOSE_PROFILES=app in .env
  #
  # `down`, `ps -a` and `logs` still see them: profiles gate what starts, not what belongs to the
  # project. Adding a profile is an override-only change, so a deployment keeps starting everything.
  backend:
    profiles: [app]
  frontend:
    profiles: [app]
  traefik:
    profiles: [app]
    # Swarm cannot publish on the loopback; compose can, so a workstation keeps it off the LAN.
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8090}:80"
    # docker-compose.yml's command with the Docker provider in place of the Swarm one: without a
    # swarm there are no services to watch, and the routing labels are on the containers.
    command: !override
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--log.level=WARN"
      - "--accesslog=false"
      - "--ping=true"
      - "--providers.docker.constraints=Label(`traefik.stack`,`${ENV_NAME}`)"
      - "--providers.docker.network=${ENV_NAME}-net"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  imgproxy:
    ports:
      - "127.0.0.1:38080:8080"

  # Web analytics, off on a workstation: nothing starts it unless asked for, by name or with
  # `--profile analytics`, and it then needs the GOATCOUNTER_* keys and scripts/goatcounter-init.sh
  # (docs/OPERATIONS.md, « Web analytics »). The site counts nothing anyway while
  # PEDALONS_ANALYTICS_COUNT_PATH is unset.
  goatcounter:
    profiles: [analytics]

  minio:
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console UI

networks:
  # Back to exactly what compose had before Swarm — a default bridge — so an existing workstation
  # network is kept rather than recreated. Overlay needs a swarm.
  pedalons:
    driver: !reset null
  # docker-compose.yml declares this one `external`, so a deployed environment refuses to start
  # until the shared stack has created it. Here tileserver belongs to *this* project, so the
  # network is ours to create — and there is no shared stack on a workstation to create it.
  shared:
    name: ${ENV_NAME}-shared
    external: false
