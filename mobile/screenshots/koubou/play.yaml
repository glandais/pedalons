# Google Play cards — Koubou sources. Run from screenshots/koubou/:
#   cd screenshots/koubou && kou generate play.yaml
# Inputs:  screenshots/flat/android/<locale>/NN-*.png (screenshots/capture-android.sh, not versioned)
# Outputs: screenshots/koubou/out/play/<locale>/…/NN-*.png, copied by assemble-play.sh into
#          android/fastlane/metadata/android/<locale>/images/phoneScreenshots/
# Same cards and captions as iphone.yaml (koubou-strings.xcstrings), no device frame: the phone is
# drawn by templates/hero-play.html. 1080 x 1920, since Play refuses a side more than twice the other.

project:
  name: Pedalons
  output_dir: out/play
  device: iPhone 17 Pro Max - Deep Blue - Portrait
  output_size:
  - 1080
  - 1920
localization:
  base_language: en-US
  languages:
  - en-US
  - fr-FR
  xcstrings_path: koubou-strings.xcstrings
screenshots:
  01-home:
    template: templates/hero-play.html
    frame: false
    variables:
      headline: Your week on the bike
      subtitle: Your next ride, this week's outings and your teams.
    assets:
      app_screenshot: ../flat/android/01-home.png
  02-ride:
    template: templates/hero-play.html
    frame: false
    variables:
      headline: Pick your pace group
      subtitle: Every group with its speed, its start time and its route.
    assets:
      app_screenshot: ../flat/android/02-ride.png
  03-weather:
    template: templates/hero-play.html
    frame: false
    variables:
      headline: Weather along the route
      subtitle: Rain, wind and temperature, at your group's pace.
    assets:
      app_screenshot: ../flat/android/03-weather.png
  04-route:
    template: templates/hero-play.html
    frame: false
    variables:
      headline: Profile, climbs and gradients
      subtitle: Every climb of the route, then off to your GPS.
    assets:
      app_screenshot: ../flat/android/04-route.png
  05-dashboard:
    template: templates/hero-play.html
    frame: false
    variables:
      headline: Your club at a glance
      subtitle: Your next rides, the latest posts, new routes and ads.
    assets:
      app_screenshot: ../flat/android/05-dashboard.png
  06-routes:
    template: templates/hero-play.html
    frame: false
    variables:
      headline: All your club's routes
      subtitle: Sort and filter by distance, climbing or hilliness.
    assets:
      app_screenshot: ../flat/android/06-routes.png
  07-calendar:
    template: templates/hero-play.html
    frame: false
    variables:
      headline: The whole season in one calendar
      subtitle: Rides and trips, and the ones you signed up for.
    assets:
      app_screenshot: ../flat/android/07-calendar.png
