name: pedalons
description: "Pédalons mobile app - cycling team platform"
publish_to: 'none'
version: 1.1.0+86

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Routing
  go_router: ^18.0.2

  # HTTP client
  dio: ^5.11.1
  retrofit: ^4.10.0

  # JSON serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0


  # WebAuthn/Passkeys
  passkeys: ^2.22.3
  passkeys_platform_interface: ^2.6.0

  # Secure storage
  flutter_secure_storage: ^11.2.0

  # Deep links
  app_links: ^7.2.2

  # Internationalization
  easy_localization: ^3.0.5
  # Direct dependency: AppFormatters uses NumberFormat/DateFormat. It also comes in
  # transitively through easy_localization/flutter_localizations — relying on that is a
  # breakage waiting for the next version bump.
  intl: ^0.20.3
  # The user's preferred timezone (UserDto.timezone), applied by AppFormatters.toDisplayTime.
  # Already shipped transitively by flutter_local_notifications.
  timezone: ^0.11.2

  # Image caching with auth headers support
  cached_network_image: ^4.0.4

  # Maps
  maplibre: ^0.3.6

  # Full-screen image viewer
  photo_view: ^0.15.0

  # Scrolling helpers (agenda jump-to-day, stage rail centering)
  scrollable_positioned_list: ^0.3.8
  scroll_to_index: ^3.0.1

  # External links (markdown links, webcal://, mailto:, tel:)
  url_launcher: ^6.3.3

  # Local mirror of UI preferences (theme, locale, units, map style, list density)
  shared_preferences: ^2.5.6

  # Avatar upload (POST /api/users/me/avatar), and a ride's logo and images in the
  # ride editor (POST /api/teams/{slug}/assets, ledger MOB-80)
  image_picker: ^1.2.4

  # A ride's attachments in the ride editor (any file the member picks, sent to
  # POST /api/teams/{slug}/assets?assetType=ATTACHMENT, ledger MOB-80)
  file_picker: ^13.1.0

  # Coarse location for the "around me" proximity filter
  geolocator: ^14.1.1

  # Share files (for route downloads)
  share_plus: ^13.3.1
  path_provider: ^2.1.6

  # Markdown rendering
  markdown_widget: ^2.3.2+6

  # Fonts
  package_info_plus: ^10.2.2
  flutter_driver:
    sdk: flutter
  # Push notifications (FCM). firebase_core reads the native config files
  # (android/app/google-services.json, ios/Runner/GoogleService-Info.plist), so
  # there is no generated firebase_options.dart to keep in sync.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Creates the `pedalons_default` Android channel — the channel_id the server
  # already sends — and shows a notification while the app is in the foreground,
  # which FCM does not do on Android.
  flutter_local_notifications: ^22.3.2
  # The device name sent with the push token, so a member can tell their phones
  # apart in a future device list.
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

  # Code generation
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.12
  openapi_retrofit_generator: ^2.0.0
  # UI end-to-end tests (patrol_test/), run with `patrol test` — see patrol_test/README.md
  patrol: ^4.10.0
  patrol_mcp: ^0.2.1

patrol:
  app_name: Pédalons
  android:
    package_name: fr.pedalons.mobile
  ios:
    bundle_id: fr.pedalons.mobile

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/icon.png
    - assets/gps/
    - privacy/

  # Inter ships with the app (rsms/inter 4.1, SIL OFL — assets/fonts/inter/OFL.txt) rather than
  # through google_fonts, which fetched it from fonts.gstatic.com at first launch: a request to
  # Google, with the device's IP, that the privacy policy had no business to explain. Only the
  # four weights the charte uses (400–700) are bundled.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
