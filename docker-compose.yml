# The deployment file. Two tools read it, and it has to stay valid for both:
#
#   - `docker stack deploy`, on a deployed host (Swarm) — always through scripts/deploy.sh, which
#     loads .env first: unlike compose, `docker stack deploy` reads no .env of its own, so every
#     ${VAR} below would silently expand to nothing.
#   - `docker compose`, on a workstation, layered with docker-compose.local.yml (see its header).
#
# Where the two disagree, this file carries both spellings. Swarm ignores `container_name`,
# `restart`, `depends_on` and `tmpfs` (it warns about the first two and says nothing about the
# others), and reads the Traefik routing labels from `deploy.labels`; compose reads them from
# `labels`. `profiles` and a top-level `name` are the opposite case: they make `docker stack deploy`
# fail outright, so neither may appear here.
#
# Every service has a memory limit, under `deploy.resources.limits`, which both tools apply. Figures,
# what each one covers and what a host must hold: docs/OPERATIONS.md, « Memory ».
services:
  # Reverse proxy
  traefik:
    image: traefik:v3.7
    container_name: ${ENV_NAME}-traefik
    restart: unless-stopped
    networks:
      - pedalons
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # Le TLS est termine par Caddy sur l'hote, qui seul doit joindre ce port. Swarm ne sait pas
      # publier sur le loopback : il ignore une IP `127.0.0.1:` (avec un simple avertissement) et
      # ecoute sur toutes les interfaces. La restriction passe donc par une regle DOCKER-USER sur
      # l'hote -- ufw ne sert a rien, Docker insere ses regles avant les siennes. Voir la section
      # « Only Caddy may reach traefik » de docs/OPERATIONS.md. docker-compose.local.yml remet le loopback sur un poste.
      - "${HTTP_PORT:-8090}:80"
    # Le provider Swarm lit les `deploy.labels` des *services* ; docker-compose.local.yml remplace
    # cette commande par la meme avec le provider Docker, qui lit les `labels` des conteneurs.
    command:
      - "--api.dashboard=false"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--log.level=WARN"
      # Pas de journal d'acces ici : celui du Caddy de l'hote est le seul, masque et borne a
      # 14 jours (docs/OPERATIONS.md, « Access logs »). Traefik ne sait pas masquer un parametre
      # de requete, et son fichier, sans volume, mourait avec le conteneur.
      - "--accesslog=false"
      # /ping for the healthcheck below, on traefik's own entrypoint (:8080): neither published nor
      # routed, and nothing else is served there (no api, no dashboard). Keep it off `web`, which
      # Caddy forwards the whole internet to. The overlays repeat it in their command.
      - "--ping=true"
      - "--providers.swarm.constraints=Label(`traefik.stack`,`${ENV_NAME}`)"
      # backend est attache a deux reseaux : sans ce reglage le provider choisit une IP au hasard
      # entre les deux, et une IP `pedalons-shared` -- que traefik ne joint pas -- donne des 502
      # sur /api.
      - "--providers.swarm.network=${ENV_NAME}-net"
      # Par defaut 15 s : pendant un rolling update, autant de temps a router vers une tache deja
      # arretee. Le health check des services (labels plus bas) couvre le reste.
      - "--providers.swarm.refreshSeconds=5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      # Only a manager answers the Swarm API over the socket above.
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M

  backend:
    # BACKEND_IMAGE_SUFFIX is "-<commit>", set by scripts/deploy.sh (see scripts/_image_tag.sh).
    # Unset on a workstation, which runs the latest build under the alias :${ENV_NAME}.
    image: pedalons-backend:${ENV_NAME}${BACKEND_IMAGE_SUFFIX:-}
    container_name: ${ENV_NAME}-backend
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - pedalons
      # tileserver vit dans la stack pedalons-shared (docker-compose.shared.yml).
      - shared
    # `docker stack deploy` honours env_file too: .env is read at deploy time, and a changed value
    # rolls the service on the next deploy.
    env_file:
      - .env
    environment:
      ERROR_LOG_DETAILS: "false"
      # Restated from .env with :? so a missing value stops the deploy instead of booting a broken
      # Domain.
      PEDALONS_BOOTSTRAP_DOMAIN: ${PEDALONS_BOOTSTRAP_DOMAIN:?set it in .env}
      PEDALONS_BOOTSTRAP_DOMAIN_NAME: ${PEDALONS_BOOTSTRAP_DOMAIN_NAME:?set it in .env}
      PEDALONS_BOOTSTRAP_BASE_URL: ${PEDALONS_BOOTSTRAP_BASE_URL:?set it in .env}
      PEDALONS_BOOTSTRAP_ADMIN_EMAIL: ${PEDALONS_BOOTSTRAP_ADMIN_EMAIL:?set it in .env}
      PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${PEDALONS_BOOTSTRAP_ADMIN_DISPLAY_NAME:?set it in .env}
      # The routing key is read per request, not at startup: without this :? a backend without it
      # would start healthy and answer 500 to every route (ledger OPS-48).
      STADIAMAPS_API_KEY: ${STADIAMAPS_API_KEY:?set it in .env}
    volumes:
      - ./data/storage:/mnt/storage
      - ./data/keys:/mnt/keys:ro
      # vcyclist's tile + elevation cache (DATA_CACHE_PATH), kept outside the container so it outlives
      # `down`.
      - ./data/cache:/mnt/cache
    # Container labels for compose's Docker provider, the same list as service labels for Swarm's.
    labels: &backend-labels
      - "traefik.enable=true"
      - "traefik.stack=${ENV_NAME}"
      - "traefik.http.routers.quarkus.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.quarkus.priority=100"
      - "traefik.http.services.quarkus.loadbalancer.server.port=8080"
      # A task that is booting, or that got SIGTERM (quarkus.shutdown.delay), gets no traffic.
      - "traefik.http.services.quarkus.loadbalancer.healthcheck.path=/q/health/ready"
      - "traefik.http.services.quarkus.loadbalancer.healthcheck.interval=3s"
      # traefik drops a server on its first failed check, and its default timeout is 5 s: one slow
      # answer under load took the only task out, and all of /api answered 503 (OPS-25). A draining
      # task answers DOWN at once, but a slow check already in flight at SIGTERM delays that by up
      # to interval + timeout: 13 s, under quarkus.shutdown.delay (15 s).
      - "traefik.http.services.quarkus.loadbalancer.healthcheck.timeout=10s"
      # Global per-client rate limit (audit M10, docs/LEDGER_*.md SEC-28): 429 past it. The client is
      # the last X-Forwarded-For hop, the one the host's Caddy sets — the only way in, see
      # docs/OPERATIONS.md « Rate limiting ». Wide on purpose: a map pans in bursts of tiles.
      - "traefik.http.routers.quarkus.middlewares=ratelimit-api,api-headers"
      - "traefik.http.middlewares.ratelimit-api.ratelimit.average=${RATE_LIMIT_API_AVERAGE:-50}"
      - "traefik.http.middlewares.ratelimit-api.ratelimit.burst=${RATE_LIMIT_API_BURST:-200}"
      - "traefik.http.middlewares.ratelimit-api.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Security headers (audit V4, docs/LEDGER_*.md SEC-30), the site's being `site-headers` in the
      # frontend's labels: each router uses its own service's middleware, so neither goes down with the
      # other. No Content-Security-Policy on the API: the downloads' sandbox CSP (UploadedContentHeaders)
      # must reach the browser untouched, and a PDF must keep none. nosniff repeats theirs. HSTS needs
      # forceSTSHeader: Caddy talks plain HTTP to traefik, which otherwise sends it on TLS requests only.
      - "traefik.http.middlewares.api-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.api-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.api-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.api-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.api-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.api-headers.headers.permissionsPolicy=camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"
    # What Swarm waits for before stopping the old task. Boot runs Flyway, hence the start period.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    # Above quarkus.shutdown.delay + quarkus.shutdown.timeout (15s + 20s).
    stop_grace_period: 40s
    deploy:
      # Rolling update: the new task starts beside the old one, which is stopped only once the new
      # one is healthy. Both run against the same database for that while — a Flyway migration must
      # leave the schema usable by the previous release (see docs/OPERATIONS.md, Rolling updates).
      update_config: &rolling-update
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      # Spelled out, not left to the default: restore.sh scales backend, frontend and minio down and
      # back up, and on a service whose file says nothing, `docker stack deploy` keeps the current
      # count — a restore that died halfway would leave them at 0 through every later deploy.
      replicas: 1
      # The JVM heap is 60 % of this (JAVA_MAX_MEM_RATIO, set in the image by
      # backend/src/main/resources/application.properties): never an -Xmx of its own, which would
      # have to be kept in step with the limit by hand.
      resources:
        limits:
          memory: ${BACKEND_MEMORY:-1536M}
      labels: *backend-labels

  frontend:
    image: pedalons-frontend:${ENV_NAME}${FRONTEND_IMAGE_SUFFIX:-}
    container_name: ${ENV_NAME}-frontend
    restart: unless-stopped
    networks:
      - pedalons
    environment:
      # The service name, not the container name: a Swarm task has none of its own.
      API_BASE_URL: http://backend:8080
      # The site's CSP (frontend/server/csp.js, docs/OPERATIONS.md « Content Security Policy »):
      # report-only until set to `enforce`; extra connect-src origins a map style reaches beyond
      # what /api/config names.
      CSP_MODE: ${CSP_MODE:-report-only}
      CSP_CONNECT_SRC_EXTRA: ${CSP_CONNECT_SRC_EXTRA:-}
    labels: &frontend-labels
      - "traefik.enable=true"
      - "traefik.stack=${ENV_NAME}"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=3s"
      # Same reason and bound as the backend's (OPS-25): 3 s + 10 s, under server.js's 15 s drain.
      - "traefik.http.services.frontend.loadbalancer.healthcheck.timeout=10s"
      # Same limit as the API's (see the backend labels), wider: a first visit loads every chunk,
      # and each document costs server-side renders that reach the backend without passing here.
      - "traefik.http.routers.frontend.middlewares=ratelimit-frontend,site-headers"
      - "traefik.http.middlewares.ratelimit-frontend.ratelimit.average=${RATE_LIMIT_FRONTEND_AVERAGE:-100}"
      - "traefik.http.middlewares.ratelimit-frontend.ratelimit.burst=${RATE_LIMIT_FRONTEND_BURST:-400}"
      - "traefik.http.middlewares.ratelimit-frontend.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # The API's headers (see the backend labels). No contentSecurityPolicy here: the site's CSP is
      # server.js's (frontend/server/csp.js, docs/LEDGER_*.md SEC-31) — a per-request nonce cannot
      # come from a label, and this middleware would overwrite the policy server.js sends.
      - "traefik.http.middlewares.site-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.site-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.site-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.site-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.site-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.site-headers.headers.permissionsPolicy=camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"
      # The Karoo app's manifest (karoo-ext MANIFEST_URL, baked into every APK): a temporary redirect
      # to the karoo-latest release that .github/workflows/karoo-release.yml rewrites, so where the
      # manifest lives can change without republishing an APK (karoo/PUBLISH.md). Never reaches the
      # frontend; the service is only there because traefik wants one per router.
      - "traefik.http.routers.karoo-manifest.rule=Path(`/karoo/manifest.json`)"
      - "traefik.http.routers.karoo-manifest.priority=200"
      - "traefik.http.routers.karoo-manifest.service=frontend"
      - "traefik.http.routers.karoo-manifest.middlewares=ratelimit-frontend,karoo-manifest"
      - "traefik.http.middlewares.karoo-manifest.redirectregex.regex=^.*"
      - "traefik.http.middlewares.karoo-manifest.redirectregex.replacement=https://github.com/glandais/pedalons/releases/download/karoo-latest/manifest.json"
      - "traefik.http.middlewares.karoo-manifest.redirectregex.permanent=false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    # Above server.js's SIGTERM drain (15s, then at most 5s to close).
    stop_grace_period: 25s
    deploy:
      replicas: 1
      update_config: *rolling-update
      rollback_config:
        order: start-first
      # Node sizes V8's heap from the cgroup limit on its own.
      resources:
        limits:
          memory: 512M
      labels: *frontend-labels

  postgres:
    # imresamu/postgis, not postgis/postgis: same builds (by a docker-postgis maintainer), but
    # published for arm64 too — the official image is amd64-only, which Docker VMM on Apple
    # Silicon cannot run.
    image: imresamu/postgis:18-3.6-alpine
    container_name: ${ENV_NAME}-postgres
    restart: unless-stopped
    networks:
      - pedalons
    # No published port here. Swarm cannot bind to the loopback (it drops `127.0.0.1:` and listens
    # on every interface), and a raw Postgres guarded by a password alone has no business there.
    # docker-compose.local.yml publishes it on a workstation; on a host, go through `docker exec`.
    # Since 18 the image keeps each major under <major>/docker in this mount, so that a later
    # upgrade can run `pg_upgrade --link` inside one volume. A new volume, not postgres_data: that
    # one holds the 17 cluster, which this image refuses to start on — scripts/postgres-upgrade.sh
    # copies it over and leaves it in place for a rollback.
    volumes:
      - pg_clusters:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # shared_buffers stays at its 128 MB default; the rest is the backend's 20 pooled connections
    # (work_mem 4 MB each, per sort) and autovacuum. The page cache counts toward the limit, but the
    # kernel reclaims it before it kills anything.
    deploy:
      resources:
        limits:
          memory: 1G

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.19
    container_name: ${ENV_NAME}-imgproxy
    restart: unless-stopped
    networks:
      - pedalons
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_JXL: "true"
      IMGPROXY_QUALITY: "85"
      # In megapixels, not pixels (checked on v4.0.14: 0.01 refuses a 200×200 PNG, 1 serves it).
      # The former "50000000" set no limit at all against a giant image.
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      # Defaults to true: served images would keep Copyright and Artist. Storage already re-encodes
      # with kcr:0 (docs/LEDGER_*.md API-43); this covers the originals not yet backfilled.
      IMGPROXY_KEEP_COPYRIGHT: "false"
      IMGPROXY_MAX_ANIMATION_FRAMES: "100"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      # Images processed at once — by default twice the host's CPUs, each of which may decode a
      # source up to IMGPROXY_MAX_SRC_RESOLUTION (50 Mpx, ~200 MB uncompressed). Fixed, so that the
      # limit below holds whatever the host.
      IMGPROXY_WORKERS: "4"
    deploy:
      resources:
        limits:
          memory: 1536M

  varnish:
    image: varnish:9.1.0-2
    container_name: ${ENV_NAME}-varnish
    restart: unless-stopped
    networks:
      - pedalons
    # varnishd resolves the VCL's backend host at compile time: started before imgproxy, it dies on
    # "could not be resolved to an IP address" and only recovers through the restart policy.
    # Swarm ignores depends_on and relies on that recovery alone.
    depends_on:
      - imgproxy
    volumes:
      - "./services/varnish/varnish.vcl:/etc/varnish/default.vcl"
    # Swarm ignores this and varnishd keeps its working dir in the image's own /var/lib/varnish,
    # which it owns. A Swarm tmpfs mount takes no uid, and comes out unwritable for varnishd.
    tmpfs:
      # varnishd runs as uid/gid 1000; a root-owned tmpfs leaves it unable to create its working dir
      - /var/lib/varnish:exec,uid=1000,gid=1000
    environment:
      # The cache lives in memory (malloc storage): keep VARNISH_MEMORY about half as much again as
      # VARNISH_SIZE, for per-object overhead, allocator slack and varnishd's own threads. A full
      # cache that exceeds the limit is killed and restarts empty.
      - VARNISH_SIZE=${VARNISH_SIZE:-1G}
    command: "-p default_ttl=86400"
    # Asks the running varnishd through its management socket, found in the default working dir.
    healthcheck:
      test: ["CMD", "varnishadm", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${VARNISH_MEMORY:-1536M}

  minio:
    # pgsty/minio, fork communautaire maintenu : l'image officielle a quitte Docker Hub en septembre
    # 2026 et l'edition communautaire amont est archivee (plus de release ni de correctif).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: ${ENV_NAME}-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - pedalons
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # `local` is the alias the image's mc ships with, pointing at this server.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - minio_data:/data
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G

  # GoatCounter, mesure d'audience du site (docs/plans/2026-10-15-web-analytics.md, ledger OPS-36 ;
  # exploitation : docs/OPERATIONS.md, « Web analytics »). Image officielle, épinglée par condensat ;
  # base « goatcounter » sur le postgres de la pile, créée par scripts/goatcounter-init.sh db. Prod
  # seulement : deploy.sh le met à 0 réplique quand GOATCOUNTER_VHOST et GOATCOUNTER_DB_PASSWORD
  # sont vides (staging) ; les overlays local et e2e le mettent derrière un profil.
  goatcounter:
    image: arp242/goatcounter:2.7.0@sha256:791df3317bf5ce379511181a4802aaf29127a318b372d4fe39ec59e1c5af44be
    container_name: ${ENV_NAME}-goatcounter
    restart: unless-stopped
    networks:
      # Pas « shared » : avec deux réseaux, Traefik choisirait l'IP au hasard (voir sa commande).
      - pedalons
    environment:
      # Le DSN, lu par `serve` comme par tout `docker exec … goatcounter db …` (GoatCounter lit ses
      # options dans les variables GOATCOUNTER_*), sans mot de passe : sans site, GoatCounter recopie
      # le DSN entier dans son journal au démarrage, qui part dans Loki. Le mot de passe passe par
      # PGPASSWORD, que lib/pq lit.
      GOATCOUNTER_DB: postgresql+host=postgres dbname=goatcounter user=goatcounter sslmode=disable
      PGPASSWORD: ${GOATCOUNTER_DB_PASSWORD:-}
    command:
      - serve
      - -listen=:8080
      # Le nom en 2.7 (« none », « proxy » : anciens alias). Le cookie du tableau de bord ne prend
      # Secure que si X-Forwarded-Proto vaut https, ce que le tunnel n'envoie pas.
      - -tls=http
      # Le schéma, créé dans la base vide au premier démarrage, migré ensuite : d'où stop-first.
      - -automigrate
      # max_open,max_idle (16,4 par défaut) : postgres est dimensionné pour les connexions du backend.
      - -dbconn=4,1
    # L'image déclare VOLUME /home/goatcounter/goatcounter-data : sans montage, chaque tâche y
    # laisserait un volume anonyme, que `docker stack rm` ne retire pas. Rien n'y est écrit (base
    # GeoIP intégrée au binaire, tout le reste dans PostgreSQL).
    volumes:
      - type: tmpfs
        target: /home/goatcounter/goatcounter-data
    # Un hit dont l'écriture échoue (base injoignable) est recopié dans le journal d'erreur, IP et
    # agent utilisateur bruts compris. Alloy écarte ces lignes avant Loki
    # (services/monitoring/alloy/config.alloy) ; la rotation borne la copie restée sur l'hôte.
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    # /status répond 200 quel que soit le Host, même base injoignable : un test de vie. wget est
    # celui de busybox, l'image n'a pas curl.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels: &goatcounter-labels
      - "traefik.enable=true"
      - "traefik.stack=${ENV_NAME}"
      # Le compteur, sur tous les hôtes : aucune règle par club. Entre /api (100) et
      # karoo-manifest (200).
      - "traefik.http.routers.goatcounter-count.rule=Path(`/count`)"
      - "traefik.http.routers.goatcounter-count.priority=150"
      - "traefik.http.routers.goatcounter-count.middlewares=ratelimit-count,count-headers"
      - "traefik.http.routers.goatcounter-count.service=goatcounter"
      # GoatCounter limite déjà /count à 4 requêtes par seconde et par IP ; celle-ci borne un client
      # comme sur les autres routeurs (docs/OPERATIONS.md « Rate limiting »).
      - "traefik.http.middlewares.ratelimit-count.ratelimit.average=10"
      - "traefik.http.middlewares.ratelimit-count.ratelimit.burst=20"
      - "traefik.http.middlewares.ratelimit-count.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Le vhost unique du site GoatCounter, pour que la mesure ne dépende pas du repli « un seul
      # site » ; le domaine du club voyage dans le chemin compté. Puis ni cookie (refresh_token est
      # en Path=/) ni Referer (l'URL entière de la page) : une valeur vide supprime l'en-tête.
      - "traefik.http.middlewares.count-headers.headers.customrequestheaders.Host=${GOATCOUNTER_VHOST:-}"
      - "traefik.http.middlewares.count-headers.headers.customrequestheaders.Cookie="
      - "traefik.http.middlewares.count-headers.headers.customrequestheaders.Referer="
      # Les en-têtes d'IP que GoatCounter préfère à X-Forwarded-For, et qu'un client pose à sa guise :
      # Caddy les laisse passer, Traefik aussi (forwardedHeaders.insecure). Retirés, l'IP lue est le
      # dernier saut public de X-Forwarded-For, celui que Caddy écrit.
      - "traefik.http.middlewares.count-headers.headers.customrequestheaders.X-Real-Ip="
      - "traefik.http.middlewares.count-headers.headers.customrequestheaders.Cf-Connecting-Ip="
      - "traefik.http.middlewares.count-headers.headers.customrequestheaders.Fly-Client-Ip="
      - "traefik.http.middlewares.count-headers.headers.customrequestheaders.X-Azure-Socketip="
      # Le tableau de bord, sur le seul vhost : aucun bloc Caddy ne le relaie, seul un tunnel jusqu'à
      # HTTP_PORT l'atteint (docs/OPERATIONS.md, « Web analytics »).
      - "traefik.http.routers.goatcounter-dash.rule=Host(`${GOATCOUNTER_VHOST:-}`)"
      - "traefik.http.routers.goatcounter-dash.service=goatcounter"
      - "traefik.http.services.goatcounter.loadbalancer.server.port=8080"
      - "traefik.http.services.goatcounter.loadbalancer.healthcheck.path=/status"
    deploy:
      # Explicite, comme backend et frontend : restore.sh le met à 0 puis le remonte. C'est deploy.sh,
      # pas ce fichier, qui le laisse à 0 là où la mesure n'existe pas.
      replicas: 1
      # stop-first, pas *rolling-update : avec -automigrate, deux instances migreraient la même base
      # en même temps. Quelques secondes de comptage perdues par mise à jour, sans conséquence.
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first
      resources:
        limits:
          memory: 128M
      labels: *goatcounter-labels

volumes:
  pg_clusters:
  minio_data:

networks:
  # Nom explicite : traefik en a besoin pour --providers.swarm.network, qui ne peut pas deviner le
  # nom derive de la stack. Sur un poste, docker-compose.local.yml en refait un reseau bridge.
  pedalons:
    name: ${ENV_NAME}-net
    driver: overlay
  # Fourni par docker-compose.shared.yml (tileserver). Le deploiement echoue tant que la
  # stack partagee n'a pas ete demarree, plutot que de creer un reseau vide.
  shared:
    name: pedalons-shared
    external: true
