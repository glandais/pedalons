# Services partages par tous les environnements deployes sur une meme machine.
#
# tileserver ne porte aucune donnee applicative : jeu de donnees statique, acces en lecture seule,
# sollicite uniquement par le backend. L'instancier une seule fois evite de payer deux fois ~1,8 Go
# de RSS. osm-route-details, de meme : des caches de tuiles, rien qui soit propre a un environnement.
# (Le routage ne tourne plus ici : le backend appelle l'API Stadia Maps avec STADIAMAPS_API_KEY,
# lue dans le .env de chaque environnement -- docs/LEDGER_*.md OPS-48.)
#
# Cette stack est prealable aux stacks d'environnement : elle cree le reseau `pedalons-shared`, que
# docker-compose.yml declare en `external`. Demarrage :
#
#   docker stack deploy -c docker-compose.shared.yml pedalons-shared
#
# Pas de `name:` en tete, ni de container_name/restart : `docker stack deploy` refuse le premier, et
# ignore les deux autres -- le nom de la stack est celui de la commande, et Swarm redemarre de lui-meme
# une tache qui meurt.
#
# Sur un poste de travail, on ne la lance pas : docker-compose.local.yml reprend ces services via
# `extends` et redeclare le reseau en reseau de projet, pour n'avoir qu'une seule stack. C'est
# aussi lui qui leur redonne un nom de conteneur et une politique de redemarrage.
#
# Les noms de service `tileserver` et `osm-route-details` sont les alias DNS sur ce reseau :
# TILESERVER_URL des .env d'environnement reste inchange, et l'URL d'osm-route-details est la valeur
# par defaut du backend.
#
# NE PAS y ajouter imgproxy/varnish tant que MinIO n'est pas mutualise : imgproxy n'expose qu'un
# IMGPROXY_S3_ENDPOINT global et ne sait pas servir deux backends S3 distincts.
services:
  tileserver:
    image: maptiler/tileserver-gl:v5.7.0
    networks:
      - shared
    volumes:
      - ./data/tileserver:/data
    # ~1,8 Go residents en production (rendu raster cote serveur).
    deploy:
      resources:
        limits:
          memory: 3G

  # Profil d'altitude et revetement des parcours (API 1.6, docs/LEDGER_*.md API-150 et OPS-58) :
  # le GpxPipeline de chaque backend y lit ses altitudes (phase B du plan
  # docs/plans/2026-11-05-osm-route-details.md), a deployer avant lui ; il a remplace osm-surface
  # pour le revetement (retire en phase F). Adresse : http://osm-route-details:8080, sans cle ; le port 9090 (/metrics) reste interne au reseau.
  # Une seule instance : la cadence IGN (20 req/s) est locale au processus, deux replicas derriere la
  # meme IP la doubleraient. Son cache disque (tuiles IGN, Mapterhorn, VersaTiles) est le VOLUME de
  # l'image, possede par 65532 : volume nomme, regenerable, hors sauvegarde
  # (IGN plafonne a 20 Go par defaut, ORD_CACHE__DISK_MAX_GB_IGN). Image distroless, mais le binaire
  # porte son propre healthcheck (HEALTHCHECK de l'image, `osm-route-details healthcheck`) : garde
  # tel quel. Journaux en JSON par defaut de l'image (ORD_LOG__FORMAT).
  # API-198 (aretes des rues des parcours d'equipe) demande l'api >= 1.7 (options.edges) : 1.8.0
  # (api 1.8, tracktype / bicycle / foot) montee le 14 novembre 2026 apres le deploiement du backend
  # qui sait les lire. Ne pas revenir sous 1.7 sans savoir que le backend cesse alors d'en demander.
  #
  # API-198/API-207, lot 3b: 1.9.0 (api 1.9) serves the route generator. It needs a graph and its
  # two views and the covered polygon, four files built on a workstation and put under
  # ./data/osm-route-details-graph/ (read only here; `deploy.sh --shared` creates the directory,
  # Swarm would not and the task would fail). ORD_GRAPH_NAME in ~/shared/.env, which
  # `deploy.sh --shared` reads, names them: <name>.ordg, <name>.road.ordv, <name>.gravel.ordv and
  # <name>.poly. Without it the generator is off (the service starts, the altitude is served and
  # GENERATOR_UNAVAILABLE answers every generation). A graph arrives under a NEW name, never over a
  # file the service has mapped: change ORD_GRAPH_NAME, redeploy the shared stack, then
  # POST /api/admin/route-generator/overlays/refresh with force on each environment
  # (docs/OPERATIONS.md "The route generator"). The team overlays live under the volume below,
  # encrypted with a key of each environment, which this stack never sees stored.
  # API-207, lot 6: 1.9.1 (api 1.9 unchanged) maps the graph and loads only the tiles around a
  # request, under one memory budget (ORD_GENERATOR__MEMORY_BUDGET_MB, 800 by default): it serves
  # the graph of France (four files, about 4.1 GB) where 1.9.0 needed 15 GB. Measured in a 2G
  # (the limit below is 3G to leave room for the altitude)
  # container with 18 team overlays: 1.10 GB of anonymous memory at most, without the altitude
  # asked alongside (docs/LEDGER_*.md OPS-61).
  # 1.9.2: a deposit waiting behind another one answers "100 Continue" at once. With 1.9.1 the
  # backend's HTTP client took the late 100 for the final answer and waited its 16 minutes
  # (staging behind prod, 2026-11-17). Do not go back under 1.9.2 while staging and prod share it.
  # 1.12.0 (lot 4): organic shapes by default and a taste profile per team, learned at each
  # deposit (up to ~7.5 min for the largest team, measured in a 3 GiB container: 1.50 GiB peak).
  # Its first start marks every overlay deposited by an older engine `stale` (reason `profile`):
  # the common table serves them until the nightly pass deposits them again. Going back under
  # 1.12 asks for the same redeposit (docs/LEDGER_*.md OPS-64).
  # 1.13.0 (lot 4, 4d): OSM attractors (cafés, bakeries, viewpoints, cols, summits) read from
  # <name>.road.orda and <name>.gravel.orda beside the views, built by `ord-graph-build attractors`
  # on the graph's extract. They stay off (generator.attractors.enabled = false): routes are those
  # of 1.12 and no redeposit is asked. A missing file only makes them unavailable (OPS-65).
  # 1.13.1: the bearing of a one-way ride picks the sectors, as for a loop (it only weighed in the
  # score: with an arrival near the start, routes went 90-170 degrees off the asked bearing).
  # 1.14.0: the generation budget goes from 8 s to 30 s (ORD_GENERATOR__BUDGET_MS), for dense cities
  # of the planet (Tokyo gravel 200 km: 25 s); routes are unchanged. The backend waits 35 s
  # (pedalons.route-generator.generate-timeout): never raise one without the other. It also reads
  # <name>.ordi beside the graph, the prebuilt tile index: without it a start rebuilds the index of
  # the planet (37 min, more than 3G). A graph is therefore five files, plus its two .orda.
  # 1.16.0 (api 1.15): POST /v1/router/route, a bicycle route from A to B with the generator's
  # weights and team affinity, on a queue of its own (2 at once, 6 waiting, 5 s:
  # ORD_GENERATOR__ROUTER_*). The planner offers it as an option (docs/LEDGER_*.md API-217) and
  # falls back on Stadia Maps whenever it cannot answer. No graph file to rebuild, no redeposit;
  # generations are unchanged. Under 1.16 the backend sees no `router` in the capabilities and
  # offers Stadia Maps alone (OPS-68).
  osm-route-details:
    image: ghcr.io/glandais/osm-route-details:1.16.0
    networks:
      - shared
    environment:
      ORD_GENERATOR__GRAPH: /var/lib/osm-route-details/graph/${ORD_GRAPH_NAME:-absent}.ordg
      ORD_GENERATOR__VIEW_ROAD: /var/lib/osm-route-details/graph/${ORD_GRAPH_NAME:-absent}.road.ordv
      ORD_GENERATOR__VIEW_GRAVEL: /var/lib/osm-route-details/graph/${ORD_GRAPH_NAME:-absent}.gravel.ordv
      ORD_GENERATOR__COVERAGE_POLY: /var/lib/osm-route-details/graph/${ORD_GRAPH_NAME:-absent}.poly
      # Caches memoire de tuiles decodees : 512 Mo chacun par defaut (« a calibrer » dans la
      # conception du service), soit deja 1 Go avant la moindre requete. Moities, en attendant
      # une mesure.
      ORD_CACHE__MEMORY_ELEVATION_MB: "256"
      ORD_CACHE__MEMORY_STREETS_MB: "256"
      # Meme glibc, meme cause que pour le backend (docs/LEDGER_*.md OPS-56).
      MALLOC_ARENA_MAX: "2"
      # Large blocks (windows, team builds) go back to the kernel when freed: 1.74 GB of anonymous
      # memory without it, 1.10 with (osm-route-details, lot 6). The image sets it too; kept here
      # so that it shows next to the limit it protects.
      MALLOC_MMAP_THRESHOLD_: "1048576"
    volumes:
      - osm-route-details-data:/var/cache/osm-route-details
      - ./data/osm-route-details-graph:/var/lib/osm-route-details/graph:ro
    # A l'arret, les requetes en vol sont attendues jusqu'a leur budget (90 s).
    stop_grace_period: 100s
    # Les deux caches memoire, plus le jeu de travail des requetes en cours (un parcours de 200 km a
    # froid : ~100 Mo de MNT, jusqu'a ~270 Mo de rues). 1G mesure trop juste le 10 novembre 2026 :
    # ~1,4 Go en tout (977 Mo + 475 Mo de swap) sous le backfill, plus que 40 Mo de page cache,
    # tuiles relues sans cesse, requetes de 20 a 45 s. 2G en attendant de voir si ca plafonne (OPS-58).
    # 3G since the graph of France (OPS-61): the generator alone reaches 1.10 GB of anonymous memory
    # with 18 team overlays, the altitude alone reached 1.4 GB on 2026-11-10, and the mapped graph
    # (4.1 GB of files) needs page cache left over. Both together were not measured.
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  osm-route-details-data:

networks:
  shared:
    name: pedalons-shared
    driver: overlay
