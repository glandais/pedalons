# Pedalons Backend Configuration

# Application
quarkus.application.name=pedalons-backend

# HTTP Configuration
quarkus.http.port=8080

quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=100M

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8180}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With
quarkus.http.cors.exposed-headers=Location,X-Total-Count,Retry-After
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Rolling update (docker-compose.yml, `order: start-first`): on SIGTERM the old task first reports
# /q/health/ready DOWN while still serving, long enough for traefik's health check to route around
# it (interval 3s + timeout 10s, docker-compose.yml, OPS-25), then drains in-flight requests. Stays
# under the service's stop_grace_period (40s).
%prod.quarkus.shutdown.delay-enabled=true
%prod.quarkus.shutdown.delay=15S
%prod.quarkus.shutdown.timeout=20S

# Container image (Jib, base ubi9/openjdk-25-runtime). Its entrypoint, run-java.sh, sizes the heap
# as -XX:MaxRAMPercentage=$JAVA_MAX_MEM_RATIO (80 when unset) of the container's memory limit — or of
# the whole host without one: ~24 GB of heap on a 30 GB machine. The limit is the service's
# deploy.resources.limits.memory in docker-compose.yml, so no -Xmx here: the heap follows it.
# 60 rather than 80 because the rest does not live in the heap and a cgroup OOM kill gives no
# ExitOnOutOfMemoryError: metaspace (~115 MB measured), code cache, ~60 threads, Netty direct
# buffers, and Magika's ONNX runtime. Metaspace is capped so a class-loading leak fails as a JVM
# error rather than as a kill. Both stay overridable from the service's environment.
quarkus.jib.environment-variables."JAVA_MAX_MEM_RATIO"=60
quarkus.jib.environment-variables."GC_MAX_METASPACE_SIZE"=256
# Jib's default application-layers cache, /tmp/jib-core-application-layers-cache, is never pruned:
# every build adds its layers until /tmp is full. Under target/, `mvn clean` empties it — the layers
# are rebuilt anyway, the app jar changes. Relative to Maven's working directory, i.e. backend/.
quarkus.jib.application-layers-cache=target/jib-cache

# ===========================================
# Database Configuration
# ===========================================
quarkus.datasource.db-kind=postgresql

# Hibernate ORM
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.schema-management.halt-on-error=true
# Batch-load lazy associations: turns N per-row SELECTs into ceil(N/32) "... WHERE id IN (?,?,...)"
# queries. Global N+1 safety net across every entity->DTO mapping (no code change required).
quarkus.hibernate-orm.fetch.batch-size=32

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration
# Swarm ignores depends_on, and a deploy that changes postgres's spec stops it (stop-first) while
# the new backend boots beside the old one: without retries Flyway fails on the first
# UnknownHostException and Swarm rolls the backend back. Backoff 1, 2, 4, 5, 5... s: about a minute,
# well inside the healthcheck's 180s start period (docs/LEDGER_DONE.md OPS-20).
quarkus.flyway.connect-retries=15
quarkus.flyway.connect-retries-interval=5S

# ===========================================
# JWT/Auth Configuration
# ===========================================

# JWT Configuration
mp.jwt.verify.issuer=pedalons
smallrye.jwt.new-token.issuer=pedalons

# Auth configuration
pedalons.auth.jwt.expiry-minutes=15
pedalons.auth.refresh-token.expiry-days=30
# The refresh token rotates at every refresh (docs/LEDGER_*.md SEC-27); the one it replaces still
# refreshes this long (other tabs, the SSR render, an app resuming), then revokes the session.
pedalons.auth.refresh-token.rotation-grace-seconds=60
pedalons.auth.email-verification.expiry-hours=24

# WebAuthn/Passkeys configuration
pedalons.auth.webauthn.challenge-expiry-minutes=5

# Cookie configuration
# The refresh_token cookie is scoped to path=/ (see RefreshTokenCookieFactory) so the SSR server
# sees it on the HTML document request. same-site is lax, not strict, for the same reason: strict
# withholds the cookie on any navigation coming from another site, and those arrivals would render
# anonymous. Lax is what makes CrossSiteRequestFilter necessary — do not relax it further.
pedalons.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
pedalons.auth.cookie.same-site=lax

# Tile token: the short HMAC passed as ?t= on the .mvt endpoints, for clients whose map renderer
# does not go through the authenticated HTTP stack (MapLibre native on mobile). The browser needs
# none of this — its session cookie rides along on same-origin requests.
# 900s mirrors pedalons.auth.jwt.expiry-minutes on purpose: a tile token must never outlive the
# credential that minted it. It is a ceiling, not a comfort setting — the token travels in a URL,
# hence in reverse-proxy logs and in MapLibre's on-disk cache.
pedalons.tiles.token.ttl-seconds=900

# App settings
pedalons.app-name=Pédalons

# API contract version (semver). Single source of truth: it feeds both GET /api/version and
# info.version in contracts/openapi.yaml. Bump it whenever the OpenAPI contract changes —
# MAJOR for breaking changes, MINOR for backwards-compatible additions, PATCH for docs only.
pedalons.api.version=11.14.0

# The classified-ad contact relay. Per sender rather than per ad: a member who may read a team's
# classifieds may write to all of them, so a per-ad cap caps nothing. What the threshold protects
# is the domain's sending reputation, and one account consumes that whoever it writes to.
pedalons.ads.contact.max-per-window=10
pedalons.ads.contact.rate-limit-window-minutes=60

# In-app feedback (FeedbackService, FeedbackGithubWorker). Reports and error reports are stored
# first, then published as issues of a PRIVATE repository — never the public code repository: an
# issue carries a member's words, device and log. Without a token and a repository nothing is
# published and rows stay PENDING (a workstation, the tests). The token is a fine-grained PAT
# restricted to that repository, Issues read & write only.
pedalons.feedback.github.repo=${PEDALONS_FEEDBACK_GITHUB_REPO:}
pedalons.feedback.github.token=${PEDALONS_FEEDBACK_GITHUB_TOKEN:}
quarkus.rest-client.github.url=https://api.github.com
# Written reports per member: a person does not write five bug reports an hour, a script does.
pedalons.feedback.max-per-window=5
pedalons.feedback.rate-limit-window-minutes=60
# Automatic error reports per member and hour, dropped silently beyond — an error loop must not
# fill the table. And new crash issues per day, whatever the number of distinct errors.
pedalons.feedback.errors.max-per-hour=20
pedalons.feedback.errors.max-new-issues-per-day=10

# Team invitations. Three dimensions, because they protect three different things.
#  - per inviter: the domain's sending reputation, consumed by an account whichever team it invites
#    to. Answers 429.
#  - per team: without it, two or three admins of one team simply add their individual quotas
#    together. Answers 429.
#  - per address: the only one that protects a person rather than the system — five clubs
#    bombarding one inbox. It fails SILENTLY (the invitation is created, only the mail is withheld),
#    because a 429 here would tell admin A that admin B, of a team A knows nothing about, has just
#    invited the same person. Same trade AuthService makes on its own rate limit.
pedalons.teams.invitations.expiry-days=14
pedalons.teams.invitations.max-per-inviter-window=20
pedalons.teams.invitations.inviter-window-minutes=60
pedalons.teams.invitations.max-per-team-day=50
pedalons.teams.invitations.max-per-email-day=5
# Terminal rows are kept: who let whom into a team should outlive the invitation.
pedalons.teams.invitations.retention-days=365
# Beta sign-ups are deleted this long after they were made (privacy policy §6).
pedalons.beta.signups.retention-days=365

# ===========================================
# Bootstrap (creates default Domain + PLATFORM_ADMIN User on startup)
# Idempotent — no-op when the rows already exist or when domain/admin-email are blank.
#
# Deliberately undefined here: deployments pass PEDALONS_BOOTSTRAP_* (see .env), and %dev sets the
# local values below. A default here would silently create a bogus Domain wherever it went unset.
# ===========================================

# Error handling
pedalons.error.log-details=${ERROR_LOG_DETAILS:false}

# Token encryption (base64-encoded 32-byte key)
pedalons.encryption.key=${ENCRYPTION_KEY:}

# Tileserver
tileserver.url=${TILESERVER_URL:http://localhost:18080}

# ===========================================
# Cartography served to the clients by GET /api/config (see MapConfig).
#
# Application configuration, not columns on Domain: every domain of an instance renders the same
# basemaps. Both clients now read this list and nothing else — the hard-coded tables they each
# carried (frontend/src/components/map/mapStyles.ts and the mobile map widgets) are gone, which is
# the duplication this replaces. Only defaultCenter differs per site, and it is derived at runtime
# from the team a single-team/pinned site roots on.
#
# pedalons.map.tile-server-base-url is the PUBLIC tile host handed to clients. It is deliberately
# unrelated to tileserver.url above, which is the internal renderer the thumbnail service talks to
# and must never leave the server.
# ===========================================
pedalons.map.tile-server-base-url=${MAP_TILE_SERVER_BASE_URL:https://tiles.versatiles.org}
pedalons.map.default-center.lat=${MAP_DEFAULT_CENTER_LAT:46.6}
pedalons.map.default-center.lon=${MAP_DEFAULT_CENTER_LON:2.3}
pedalons.map.default-center.zoom=${MAP_DEFAULT_CENTER_ZOOM:5}

# The elevation source the clients shade the relief with (raster-DEM). Blank the URL and no client
# offers relief at all — the switch disappears rather than pointing at a provider nobody chose.
# The TileJSON declares the encoding (Mapterhorn serves Terrarium), which is the only channel the
# mobile SDKs read; max-zoom is honoured by the web, the native SDKs take their range from TileJSON.
pedalons.map.terrain.url=${MAP_TERRAIN_URL:https://tiles.mapterhorn.com/tilejson.json}
pedalons.map.terrain.max-zoom=${MAP_TERRAIN_MAX_ZOOM:16}

# A style carries either a hosted `url` (someone else's style.json) or a `raster.*` block, never
# both: raster providers serve tiles and no style document, so MapStyleService generates the
# one-layer MapLibre wrapper and the served `url` points at /api/map/styles/{id}.json. That wrapper
# was hand-written in the web client and simply missing from the mobile one, which is why the app
# had vector fonds only.
#
# `graybeard` ("Sobre") was dropped: it shared colorful's dark-variant, so in dark mode the two
# entries loaded the very same document, and the web never offered it at all.
pedalons.map.styles[0].id=colorful
pedalons.map.styles[0].label=Plan
pedalons.map.styles[0].group=vector
pedalons.map.styles[0].url=https://tiles.versatiles.org/assets/styles/colorful/style.json
pedalons.map.styles[0].dark-variant=https://tiles.versatiles.org/assets/styles/eclipse/style.json
pedalons.map.styles[1].id=ign-vector
pedalons.map.styles[1].label=IGN (France)
pedalons.map.styles[1].group=vector
pedalons.map.styles[1].url=https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json
# The one style whose document credits nobody: PLAN.IGN/standard.json declares no `attribution` on
# its source, and neither does the TMS metadata.json it points at. Without this line the fond
# renders uncredited on every client. `attribution` is additive — see MapConfig.Style — so it is
# left empty everywhere else, VersaTiles and the generated raster wrappers crediting themselves.
pedalons.map.styles[1].attribution=<a target="_blank" href="https://www.ign.fr/">IGN</a> &mdash; <a target="_blank" href="https://www.geoportail.gouv.fr/">Geoportail</a>

pedalons.map.styles[2].id=ign-satellite
pedalons.map.styles[2].label=Satellite (IGN)
pedalons.map.styles[2].group=satellite
pedalons.map.styles[2].raster.tiles[0]=https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&STYLE=normal&FORMAT=image/jpeg&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&TILEMATRIXSET=PM&TILEMATRIX={z}&TILECOL={x}&TILEROW={y}
pedalons.map.styles[2].raster.attribution=<a target="_blank" href="https://www.geoportail.gouv.fr/">Geoportail France</a>
pedalons.map.styles[3].id=esri-satellite
pedalons.map.styles[3].label=Satellite (ESRI)
pedalons.map.styles[3].group=satellite
pedalons.map.styles[3].raster.tiles[0]=https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
pedalons.map.styles[3].raster.attribution=Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community

pedalons.map.styles[4].id=osm
pedalons.map.styles[4].label=OpenStreetMap
pedalons.map.styles[4].group=raster
pedalons.map.styles[4].raster.tiles[0]=https://tile.openstreetmap.org/{z}/{x}/{y}.png
pedalons.map.styles[4].raster.attribution=&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>
# CyclOSM has no {s} token in MapLibre — each subdomain is its own template. Native zooms stop at 17.
pedalons.map.styles[5].id=cyclosm
pedalons.map.styles[5].label=CyclOSM
pedalons.map.styles[5].group=raster
pedalons.map.styles[5].raster.tiles[0]=https://a.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png
pedalons.map.styles[5].raster.tiles[1]=https://b.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png
pedalons.map.styles[5].raster.tiles[2]=https://c.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png
pedalons.map.styles[5].raster.max-zoom=17
pedalons.map.styles[5].raster.attribution=<a href="https://github.com/cyclosm/cyclosm-cartocss-style/releases" title="CyclOSM - Open Bicycle render">CyclOSM</a> | &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>
# SCAN 25 is IGN's topographic map. It sits behind /private and needs the shared transitional key
# `ign_scan_ws` (IGN's public stopgap for non-open SCAN data — still live as of 2026; the long-term
# path is a per-account HASH key from cartes.gouv.fr). France-only, native zooms ~6–16.
pedalons.map.styles[6].id=ign-scan25
pedalons.map.styles[6].label=IGN SCAN 25 (France)
pedalons.map.styles[6].group=raster
pedalons.map.styles[6].raster.tiles[0]=https://data.geopf.fr/private/wmts?apikey=ign_scan_ws&SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&STYLE=normal&FORMAT=image/jpeg&LAYER=GEOGRAPHICALGRIDSYSTEMS.MAPS.SCAN25TOUR&TILEMATRIXSET=PM&TILEMATRIX={z}&TILECOL={x}&TILEROW={y}
pedalons.map.styles[6].raster.min-zoom=6
pedalons.map.styles[6].raster.max-zoom=16
pedalons.map.styles[6].raster.attribution=<a target="_blank" href="https://www.geoportail.gouv.fr/">Geoportail France</a>

pedalons.map.styles[7].id=michelin
pedalons.map.styles[7].label=Michelin (France)
pedalons.map.styles[7].group=raster
pedalons.map.styles[7].raster.tiles[0]=https://tiles.pedalons.fr/michelin/{z}/{x}/{y}.png
pedalons.map.styles[7].raster.min-zoom=9
pedalons.map.styles[7].raster.max-zoom=12
pedalons.map.styles[7].raster.attribution=Michelin

# ===========================================
# Geocoding (Stadia Maps geocoder v2, docs/LEDGER_*.md OPS-49, API-129), served to the clients'
# forms by GET /api/geocode/search (suggestions) and GET /api/geocode/place (the picked one's
# position).
#
# Same host, key and header as the route planner (STADIAMAPS_URL / STADIAMAPS_API_KEY, the
# pedalons.routing.stadiamaps.api-key property below) — nothing of its own to configure. A REST
# client of its own all the same (two interfaces on one config key is not something to bet on),
# which is why the URL and the timeouts are restated by reference.
#
# v2, in two calls: /geocoding/v2/autocomplete (1 credit a request, geometry: null on most hits)
# while typing, then /geocoding/v2/place_details?ids=<gid> (Place Lookup, 20 credits per GID) once,
# for the result picked. v1 autocomplete gave the position in one call but cost 20 credits a
# request: a search of ~4 keystrokes and a pick is ~80 credits in v1, ~24 in v2
# (stadiamaps.com/pricing, as of 2026-10-17). Resolving the five suggestions server-side would be
# 100 credits a keystroke — the lookup runs on selection only. The map search bar (WEB-99) is
# another path entirely: the browser calls Stadia Maps directly, authenticated by domain, with no
# key.
# ===========================================
quarkus.rest-client.stadiamaps-geocoding.url=${quarkus.rest-client.stadiamaps.url}
quarkus.rest-client.stadiamaps-geocoding.connect-timeout=${quarkus.rest-client.stadiamaps.connect-timeout}
quarkus.rest-client.stadiamaps-geocoding.read-timeout=${quarkus.rest-client.stadiamaps.read-timeout}
# A day is longer than most caches want, and right here: a town does not move, and every entry that
# survives is one billed call fewer. The bound is what keeps an autocomplete — which sends every
# prefix of what is being typed — from growing the heap.
quarkus.cache.caffeine."geocode-search".expire-after-write=PT24H
quarkus.cache.caffeine."geocode-search".maximum-size=2000
# A failed search is not cached either (the lookup throws, the service answers an empty list).
# Place lookups, keyed on the GID and the language: a day too, for the same reason and with more
# at stake — each entry that hits saves 20 credits. Smaller than the search cache: one entry per
# place actually picked, not per prefix typed. Failures are not cached (an exception stores nothing).
quarkus.cache.caffeine."geocode-place".expire-after-write=PT24H
quarkus.cache.caffeine."geocode-place".maximum-size=1000

# ===========================================
# Automatic route sync to the members' GPS services (Hammerhead, Wahoo, Garmin), opt-in per
# connection — docs/LEDGER_*.md API-120, docs/plans/2026-10-16-gps-route-autosync.md.
#
# Never called during an HTTP request: GpsRouteSyncPlanner (every minute) works out which route each
# opted-in connection should hold (rides the member is registered in, group leaving within the
# horizon), GpsRouteSyncWorker (every 20 s) creates, updates and deletes them at the services under
# a lease. Off by default; on in prod and staging since 2026-10-16. Off, the switch is hidden and
# stored, and nothing is sent, updated or removed — see docs/OPERATIONS.md.
# ===========================================
pedalons.gps-sync.enabled=${GPS_SYNC_ENABLED:false}
# How far ahead a ride's route is sent, and how long after the group's departure it stays.
pedalons.gps-sync.horizon=P7D
pedalons.gps-sync.retention=P1D

# ===========================================
# Elevation: fast at save time, IGN LiDAR HD afterwards — docs/LEDGER_*.md API-131,
# docs/plans/archive/2026-10-17-altitude-hd-asynchrone.md.
#
# A saved route is computed with Mapterhorn alone (FAST); ElevationRefreshWorker (every 30 s)
# recomputes it with IGN LiDAR HD once it has been left alone for `quiet`, and swaps the profile,
# the filtered GPX and the FIT in place (same URLs). A stream of saves postpones the catch-up, but
# never beyond `max-wait` after the first of them. Switched off, a save computes HD synchronously
# and queues nothing (the worker still drains what is queued).
# ===========================================
pedalons.elevation.async-hd.enabled=true
pedalons.elevation.async-hd.quiet=PT90S
pedalons.elevation.async-hd.max-wait=PT10M

# ===========================================
# Surface along saved tracks (Stadia Maps trace_attributes, docs/LEDGER_*.md WEB-100 C1b,
# docs/research/2026-10-19-stadia-surfaces.md).
#
# Never called during an HTTP request: a save of a track (route or GPX-tool preview) queues a
# request in its transaction; SurfaceRefreshWorker (every 30 s) sends the stored track, once it has
# been left alone for `quiet` (never beyond `max-wait`), in map_snap mode, and stores the surface
# as ranges along the track. 20 credits per 190 km slice. Same key and host as the planner.
# Off: no new request and the worker sends nothing (the queue waits). Also off whenever the key is
# empty (a dev backend without STADIAMAPS_API_KEY). The e2e stack turns it off (.env.e2e).
# ===========================================
pedalons.surface.enabled=${SURFACE_ENABLED:true}
pedalons.surface.quiet=PT90S
pedalons.surface.max-wait=PT10M
# The catch-up of the tracks saved before the surface existed, biketeam ones included (WEB-100 C1c):
# every 5 min SurfaceBackfill queues the routes (most recent first), then the GPX-tool previews,
# that have neither a surface nor a request, at most `per-hour` provider calls an hour across all
# backends (a 188 km slice is a call, 20 credits: 300/h = 6,000 credits/h). Its requests wait for
# the normal ones. No effect while pedalons.surface.enabled is off. See docs/OPERATIONS.md.
pedalons.surface.backfill.enabled=${SURFACE_BACKFILL_ENABLED:true}
pedalons.surface.backfill.per-hour=${SURFACE_BACKFILL_PER_HOUR:300}
quarkus.rest-client.stadiamaps-trace.url=${quarkus.rest-client.stadiamaps.url}
quarkus.rest-client.stadiamaps-trace.connect-timeout=${quarkus.rest-client.stadiamaps.connect-timeout}
quarkus.rest-client.stadiamaps-trace.read-timeout=${quarkus.rest-client.stadiamaps.read-timeout}
# Off by default in the REST client: without it, no Accept-Encoding and 4x the bytes (244 kB vs 57 kB
# for 130 km).
quarkus.rest-client.stadiamaps-trace.enable-response-decompression=true

# ===========================================
# Ride weather (Open-Meteo), docs/plans/archive/2026-10-05-weather.md.
#
# Never called during an HTTP request: WeatherPlanner (every 5 min) works out which ~5 km cells the
# rides of the next 7 days need, WeatherFetchWorker (every minute) refreshes the due ones into the
# global cache (weather_cells / weather_hourly / weather_daily), and the API reads only that cache.
#
# OPEN_METEO_URL + OPEN_METEO_API_KEY: the free endpoint by default (non-commercial use, ~10 000
# calls a day); a commercial plan is https://customer-api.open-meteo.com plus its key, no code change.
# The key travels as a query parameter: nothing logs the request URL. Attribution « Open-Meteo.com »
# (CC BY 4.0) is shown with every forecast.
# ===========================================
pedalons.weather.enabled=${WEATHER_ENABLED:true}
quarkus.rest-client.open-meteo.url=${OPEN_METEO_URL:https://api.open-meteo.com}
quarkus.rest-client.open-meteo.connect-timeout=3000
quarkus.rest-client.open-meteo.read-timeout=15000
# OpenMeteoGateway reads every status itself (a 429 waits for the next full hour): without this, the
# client's default mapper turns any status >= 400 into a WebApplicationException first.
quarkus.rest-client.open-meteo.disable-default-mapper=true
pedalons.weather.api-key=${OPEN_METEO_API_KEY:}
# Open-Meteo asks callers to identify themselves. PEDALONS_USER_AGENT overrides it for a fork.
pedalons.weather.user-agent=${PEDALONS_USER_AGENT:Pedalons/${pedalons.api.version} (+https://www.pedalons.fr)}

# ===========================================
# Route planner (Stadia Maps routing API, docs/LEDGER_*.md OPS-48).
#
# POST /route/v1 speaks the Valhalla protocol (fr.pedalons.infrastructure.valhalla), hence the
# package name; Pédalons no longer hosts a router. The key goes in the Authorization header
# (Stadia-Auth), never in the URL, and nothing logs the request: a failure is logged by its status
# alone. Published limits: 50 locations, 500 km as the crow flies for a bicycle, HTTP 429 past the
# quota. The key itself is set per profile below (%prod requires it, %dev/%test default to empty).
# ===========================================
# The EU-only host: requests stay on servers in the European Union (api.stadiamaps.com is the
# global one, same key, same API).
quarkus.rest-client.stadiamaps.url=${STADIAMAPS_URL:https://api-eu.stadiamaps.com}
quarkus.rest-client.stadiamaps.connect-timeout=3000
quarkus.rest-client.stadiamaps.read-timeout=15000
# Locations (= billed calls) per UTC day this instance may ask for. Below the free plan's 10 000 on
# purpose: two backends share the quota for a minute during a deploy, and so does anything else
# behind the same egress address.
pedalons.weather.daily-call-budget=${OPEN_METEO_DAILY_CALL_BUDGET:5000}
# The same per sliding hour and minute, under the free plan's 5 000 an hour and 600 a minute: one
# tick drains up to 1 000 locations of a backlog, and a 429 stops every refresh until the next full
# hour. A commercial plan raises all three.
pedalons.weather.hourly-call-budget=${OPEN_METEO_HOURLY_CALL_BUDGET:4500}
pedalons.weather.per-minute-call-budget=${OPEN_METEO_PER_MINUTE_CALL_BUDGET:500}
# Distance between two forecast points along a route.
pedalons.weather.sample-step-km=15
# A route's sampled points, keyed by its sorted track ids: tracks are replaced, never edited, so an
# entry never goes stale — the expiry only keeps routes nobody rides any more from holding memory.
quarkus.cache.caffeine."weather-route-samples".expire-after-access=PT24H
quarkus.cache.caffeine."weather-route-samples".maximum-size=1000

# Oldest mobile build this server still serves (semver). Blank = no floor enforced.
# Exposed on ConfigDto rather than VersionDto because the app reads the config at startup.
pedalons.mobile.min-supported-app-version=${MIN_SUPPORTED_APP_VERSION:}

# OpenAPI
quarkus.smallrye-openapi.info-title=Pedalons API
quarkus.smallrye-openapi.info-version=${pedalons.api.version}
quarkus.smallrye-openapi.info-description=API for Pedalons Cycling Team Management Platform
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.store-schema-directory=../contracts
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
quarkus.smallrye-openapi.oidc-open-id-connect-url=http://localhost:8180/realms/quarkus/.well-known/openid-configuration
mp.openapi.scan.exclude.packages=org.geolatte.geom

# Logging
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."fr.pedalons".level=INFO
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.category."org.hibernate.tool.schema".level=INFO
# One JSON object per event in %prod — a stack trace included, where the text format spreads it over
# lines that Loki receives one by one (docker-compose.monitoring.yml, services/monitoring/alloy).
# Adding quarkus-logging-json turns it on everywhere: dev and tests keep the text format.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true

%dev.quarkus.log.file.enabled=true
%dev.quarkus.log.file.path=target/pedalons-dev.log
%dev.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
%dev.quarkus.log.file.level=INFO

# Metrics — /q/metrics, Prometheus format. /q is not routed by traefik (only /api is), so it is
# reached from the monitoring stack's Prometheus over pedalons-shared, never from outside. The pool
# metrics feed its BackendConnectionPoolExhausted alert.
quarkus.datasource.metrics.enabled=true

# Indexing
quarkus.index-dependency.geolatte.group-id=org.geolatte
quarkus.index-dependency.geolatte.artifact-id=geolatte-geom

# ===========================================
# Biketeam live migration (off unless all five values below are set)
# ===========================================
# See docs/plans/2026-09-22-biketeam-live-migration.md. Optional<String> on the Java side: SmallRye
# turns an empty value into null and refuses to inject it.
#   PEDALONS_BIKETEAM_REQUEST_KEY    base64 HMAC key (>= 32 bytes) biketeam signs requests with
#   PEDALONS_BIKETEAM_TRIGGER_SECRET header secret biketeam sends to /api/internal/…
#   PEDALONS_BIKETEAM_EXPORT_URL     biketeam public base URL, https:// (http:// only to localhost)
#   PEDALONS_BIKETEAM_EXPORT_SECRET  header secret sent to biketeam's /internal/pedalons/…
#   PEDALONS_BIKETEAM_PUBLIC_URL     biketeam's public site.url, e.g. https://www.prendslaroue.fr
pedalons.biketeam.grant-ttl=PT10M
# Finished jobs and lapsed grants are deleted this long after they ended (privacy policy §6). Runs
# even with the migration off: the rows it left behind still have to go.
pedalons.biketeam.retention-days=365
pedalons.biketeam.max-attempts=3
# A RUNNING job without a heartbeat for stuck-after is requeued. Startup fails unless it exceeds
# the longest silence of a live job: export-snapshot-timeout + idle + 1 min, or a file's 120 s
# headers + idle + 1 min + the 600 s transaction of a route — plus 2 min (16 min with the defaults).
pedalons.biketeam.stuck-after=PT20M
# A response body of the export that sends nothing for export-idle-timeout, or takes more than
# export-transfer-timeout in all, is given up (EXPORT_UNAVAILABLE, retried). Downloads write the
# heartbeat at most once a minute while data comes in.
pedalons.biketeam.export-idle-timeout=PT60S
pedalons.biketeam.export-transfer-timeout=PT10M
# How long the snapshot's headers may take (a file's: 120 s): biketeam may hash a big team's files
# before it answers.
pedalons.biketeam.export-snapshot-timeout=PT5M

# ===========================================
# S3/MinIO Storage Configuration
# ===========================================
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
storage.bucket=${STORAGE_BUCKET:pedalons}

# ===========================================
# Production profile settings
# All values must be provided via environment variables
# ===========================================

# Database
%prod.quarkus.datasource.username=${POSTGRES_USER}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

# Storage
%prod.pedalons.data.cache=${DATA_CACHE_PATH}
%prod.quarkus.s3.endpoint-override=${MINIO_ENDPOINT}
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY}

# Services
%prod.quarkus.rest-client.imgproxy.url=${IMGPROXY_URL}
# No default for the key. docker-compose.yml restates it with :? so a deploy without it stops before
# anything starts: the header is resolved per request, so the backend alone would start and fail every
# route with a 500.
%prod.pedalons.routing.stadiamaps.api-key=${STADIAMAPS_API_KEY}

# Auth configuration (production)
%prod.pedalons.auth.cookie.secure=true
%prod.mp.jwt.verify.publickey.location=file:/mnt/keys/publicKey.pem
%prod.smallrye.jwt.sign.key.location=file:/mnt/keys/privateKey.pem

# ===========================================
# Dev services
# ===========================================

# Default Dev Services image, used by the test profile (dev and prod both set a JDBC URL, which
# disables Dev Services). In tests this is overridden by DevServicesImageConfigSource, which reads
# the postgres tag from ../docker-compose.yml (kept up to date by Dependabot).
quarkus.datasource.devservices.image-name=imresamu/postgis:17-3.5-alpine

# ===========================================
# Dev profile settings
# ===========================================
#
# The dev backend runs outside Docker and talks to the workstation stack
# (docker-compose.yml + docker-compose.local.yml) over the loopback ports that overlay publishes.
# Credentials therefore come from the very .env that stack reads: run `source scripts/dev-env.sh`
# first. Do NOT source the whole .env — its PEDALONS_BOOTSTRAP_* and QUARKUS_MAILER_* would
# override the %dev values below, and the dev bootstrap domain has to stay `localhost`.
# The defaults are .env.example's, so a stack left at those values needs no export at all.

%dev.pedalons.data.cache=/tmp/pedalons-data-cache-dev
%dev.quarkus.rest-client.imgproxy.url=http://localhost:38080
# scripts/dev-env.sh exports STADIAMAPS_API_KEY from .env; without it the planner answers an error.
%dev.pedalons.routing.stadiamaps.api-key=${STADIAMAPS_API_KEY:}
%dev.tileserver.url=http://localhost:18080
%dev.quarkus.live-reload.instrumentation=true

# S3/MinIO (dev)
%dev.quarkus.s3.endpoint-override=http://localhost:9000
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:pedalons}
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:pedalons}

%dev.quarkus.datasource.username=${POSTGRES_USER:pedalons}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD:pedalons}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/${POSTGRES_DB:pedalons}

%dev.quarkus.hibernate-orm.log.sql=true

# Bootstrap domain + platform admin (dev). base-url must match the Vite origin, since it becomes
# the WebAuthn origin for passkeys and the prefix of the links sent by email.
%dev.pedalons.bootstrap.domain=localhost
%dev.pedalons.bootstrap.domain-name=Pedalons Dev
%dev.pedalons.bootstrap.base-url=https://localhost:5173
%dev.pedalons.bootstrap.admin-email=gabriel.landais@gmail.com
%dev.pedalons.bootstrap.admin-display-name=Gaby Landais

# Encryption key (dev - DO NOT USE IN PRODUCTION)
# Generated with: openssl rand -base64 32
%dev.pedalons.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Auth (dev)
%dev.pedalons.auth.cookie.secure=false

# Mailer (dev) - Mailpit
%dev.quarkus.mailer.from=noreply@pedalons.local
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.mock=false

# Mailer (prod) - Scaleway Transactional Email, over SMTP
# Every e-mail is rendered from src/main/resources/templates/mail/<name>.<lang>.{html,txt} (Qute) and
# handed to the Quarkus mailer; there is no provider-side template. In %prod the mailer is configured
# entirely by QUARKUS_MAILER_* in .env: host smtp.tem.scaleway.com, port 587 with STARTTLS,
# username = the Scaleway project id, password = an IAM secret key whose principal holds
# TransactionalEmailEmailFullAccess, and a `from` on a domain verified in TEM. A workstation stack
# points the same variables at mailpit — see .env.example.

# How long a send may wait before failing, on every profile (EmailService reads it and waits itself).
# The default is 60 s, longer than any client waits: a stalled send then ended after the caller had
# gone, with nothing in the log. The Vert.x mail client could lose a send for good on a cold pool
# (a dropped server greeting) — EmailService now starts every send on one event loop, see there —
# but the bound stays: a relay can still hang. A healthy relay answers in well under a second.
quarkus.mailer.timeout=15s

# ===========================================
# Notifications — docs/plans/archive/2026-09-18-notifications.md
# ===========================================
# The e-mail channel is off unless switched on. In production it writes to every member whose
# defaults include e-mail (NotificationType), which is a product decision, not a deployment side
# effect. Dev sends to Mailpit.
pedalons.notifications.email.enabled=false
%dev.pedalons.notifications.email.enabled=true
%test.pedalons.notifications.email.enabled=true
# Events and inbox entries older than this are purged nightly.
pedalons.notifications.retention-days=90
# A ride edit (date, meeting point) waits this long before notifying its riders: further edits in
# the window fold into one notification.
pedalons.notifications.update-delay-seconds=300

# The push channel. Off unless switched on AND given a service account — FcmClient reports itself
# unconfigured otherwise, PushNotificationSender then reports the channel unavailable, and the
# fan-out queues no push delivery at all. A deployment turns it on with PEDALONS_PUSH_ENABLED=true
# in .env, once the Firebase service account sits in data/keys (see .env.example).
pedalons.push.enabled=false
# The Google service account JSON — either a path to the mounted secret, or the document itself.
# data/keys is already mounted read-only at /mnt/keys for the JWT keys, and saved by backup.sh.
%prod.pedalons.push.fcm.credentials=${FCM_CREDENTIALS:/mnt/keys/fcm-service-account.json}
# Optional: overrides the project_id carried by the credentials, which is normally right.
# %prod.pedalons.push.fcm.project-id=${FCM_PROJECT_ID}
# Push in the browser (the site installed as an app): the Firebase *web app* of the same project,
# from the Firebase console (Project settings > General > Your apps, and Cloud Messaging > Web Push
# certificates for the VAPID key). All public values; all four are needed, and the channel above
# must be on — otherwise GET /api/config carries no webPush and the site offers no notification.
pedalons.push.web.api-key=${FCM_WEB_API_KEY:}
pedalons.push.web.app-id=${FCM_WEB_APP_ID:}
pedalons.push.web.messaging-sender-id=${FCM_WEB_MESSAGING_SENDER_ID:}
pedalons.push.web.vapid-key=${FCM_WEB_VAPID_KEY:}

# Audience measurement (GoatCounter, docs/plans/2026-10-15-web-analytics.md, docs/LEDGER_*.md
# API-117): the same-origin path the site counts its page views on, /count in prod only. Unset means
# no measurement — GET /api/config then carries no analytics and the site sends nothing. Never set
# in dev, on a workstation stack or in .env.e2e; %dev and %test force it off even if the variable
# leaks in.
pedalons.analytics.count-path=${PEDALONS_ANALYTICS_COUNT_PATH:}
%dev.pedalons.analytics.count-path=
%test.pedalons.analytics.count-path=
quarkus.rest-client.fcm.url=https://fcm.googleapis.com
quarkus.rest-client.google-oauth.url=https://oauth2.googleapis.com

%dev.mp.jwt.verify.publickey.location=keys/publicKey.pem
%dev.smallrye.jwt.sign.key.location=keys/privateKey.pem

# ===========================================
# Test profile settings
# ===========================================
%test.quarkus.devservices.enabled=true
# Random test HTTP port so parallel Surefire forks don't collide on 8081
%test.quarkus.http.test-port=0
# Test DB is drop-and-create: durability is irrelevant, disable fsync at server level
%test.quarkus.datasource.devservices.init-script-path=init-test-db.sql
# Coverage instrumentation is opt-in: mvn test -Dcoverage=true -Dsurefire.forkCount=1
%test.quarkus.jacoco.enabled=${coverage:false}
%test.pedalons.data.cache=/tmp/pedalons-data-cache-test
%test.quarkus.rest-client.imgproxy.url=http://localhost:38080
# No backend test calls the router: an empty key keeps the client injectable.
%test.pedalons.routing.stadiamaps.api-key=${STADIAMAPS_API_KEY:}
%test.tileserver.url=http://localhost:18080

# S3/MinIO (test) - overridden by MinioTestResource (testcontainer) on AbstractResourceTest
%test.quarkus.s3.endpoint-override=http://localhost:9000
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=pedalons
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=pedalons_secret
# Use Apache HTTP client in tests: URL connection client mishandles Expect: 100-continue against S3Mock (random "Unexpected end of file from server")
%test.quarkus.s3.sync-client.type=apache
%test.quarkus.http.body.uploads-directory=/tmp/pedalons-uploads-test
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.halt-on-error=true
%test.quarkus.hibernate-orm.log.sql=false
# Enable Hibernate Statistics in tests so QueryStats can count SQL statements per API call.
%test.quarkus.hibernate-orm.statistics=true
# Tests skip Flyway, so DB objects Hibernate doesn't create (route_mvt_row) are declared here
%test.quarkus.hibernate-orm.sql-load-script=import-test.sql
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.validate-on-migrate=false
%test.quarkus.log.category."fr.pedalons".level=INFO
%test.quarkus.scheduler.enabled=false
# Route sync on for the whole test context, as in production once enabled (no @TestProfile, hence
# no Quarkus restart). The scheduler being off, nothing ticks: the tests call the planner and the
# worker themselves. What changes with it off is GpsRouteSyncService#routeState, unit-tested.
%test.pedalons.gps-sync.enabled=true
# Async HD elevation on for the whole test context: the tests need the queue. Nothing ticks (scheduler
# off); they call ElevationRefreshWorker.processDue() themselves.
%test.pedalons.elevation.async-hd.enabled=true
# Surface off for the whole test context: the dedicated tests switch it on with a mocked client, no
# test reaches Stadia.
%test.pedalons.surface.enabled=false
# The catch-up off too: SurfaceBackfillTest switches it on (setForTest).
%test.pedalons.surface.backfill.enabled=false
# Biketeam live migration on for the whole test context (no @TestProfile, hence no Quarkus restart).
# The key is the plan's §3.2 test vector (bytes 0x00…0x1f); the export URL is never reached — the
# worker tests hand it a fixture snapshot. Mirrored by BiketeamTestTokens.
%test.pedalons.biketeam.request-key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
%test.pedalons.biketeam.trigger-secret=test-trigger-secret
%test.pedalons.biketeam.export-url=http://127.0.0.1:9
%test.pedalons.biketeam.export-secret=test-export-secret
%test.pedalons.biketeam.public-url=https://biketeam.example
%test.pedalons.bootstrap.enabled=false
# No network from the tests: the forecast gateway refuses every request (tests mock it).
%test.pedalons.weather.enabled=false

# Encryption key (test)
%test.pedalons.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# GPS Services (test)
%test.pedalons.gps.hammerhead.client-id=test-client-id
%test.pedalons.gps.hammerhead.client-secret=test-client-secret
%test.pedalons.gps.garmin.client-id=test-garmin-client-id

%test.quarkus.hibernate-orm.scripts.generation=create
%test.quarkus.hibernate-orm.scripts.generation.create-target=target/fresh.sql

# Auth (test)
%test.pedalons.auth.cookie.secure=false

# Mailer (test) - mock
%test.quarkus.mailer.mock=true

%test.mp.jwt.verify.publickey.location=keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=keys/privateKey.pem

# GDPR self-service data export (DSAR)
# One export per user per hour: each one reads every object that user owns out of storage.
pedalons.export.cooldown-hours=1
# How long the emailed download link stays alive before the archive is deleted.
pedalons.export.expiry-days=7
# Hard ceiling on one archive (2 GiB). Past it the job fails cleanly instead of filling the disk.
pedalons.export.max-bytes=2147483648
# A PROCESSING row untouched for this long is assumed crashed and goes back on the queue.
pedalons.export.stuck-after-minutes=60
pedalons.export.max-attempts=3
# A link minted this recently, with no recorded mail failure, is a mail still being sent (maybe by
# the other backend during a rolling deploy): the email retry leaves it alone until then.
pedalons.export.email-retry-grace-minutes=10
# How long finished rows are kept, so the user can still see "my last export was on ...".
pedalons.export.history-days=90
# Where archives are assembled before upload. Defaults to ${java.io.tmpdir}/pedalons-exports;
# in prod that is the container overlay filesystem with no size cap, so point it at a volume
# (e.g. the existing ./data/cache mount) if users have large accounts.
# pedalons.export.temp-dir=/mnt/cache/exports
