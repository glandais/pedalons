# See texts_fr.properties for the placeholders and the rules.

RIDE_PUBLISHED.subject={when}: {subject}
RIDE_PUBLISHED.title={when}: {subject}
RIDE_PUBLISHED.body=New ride published by {actor}, starting on {date}.
RIDE_PUBLISHED.cta=View the ride

RIDE_CANCELLED.subject=Cancelled, {when}: {subject}
RIDE_CANCELLED.title=Cancelled, {when}: {subject}
RIDE_CANCELLED.body=The ride on {date}, which you had joined, is cancelled.
RIDE_CANCELLED.cta=View the ride

TRIP_PUBLISHED.subject={when}: {subject}
TRIP_PUBLISHED.title={when}: {subject}
TRIP_PUBLISHED.body=New trip published by {actor}, starting on {date}.
TRIP_PUBLISHED.cta=View the trip

TRIP_CANCELLED.subject=Cancelled, {when}: {subject}
TRIP_CANCELLED.title=Cancelled, {when}: {subject}
TRIP_CANCELLED.body=The trip on {date}, which you had joined, is cancelled.
TRIP_CANCELLED.cta=View the trip

POST_PUBLISHED.subject=New post: {subject}
POST_PUBLISHED.title=New post in {team}
POST_PUBLISHED.body={actor} published "{subject}".
POST_PUBLISHED.cta=Read the post

COMMENT_REPLY.subject={actor} replied to you
COMMENT_REPLY.title=New reply
COMMENT_REPLY.body={actor} replied to your comment on "{subject}": "{excerpt}"
COMMENT_REPLY.cta=View the conversation

RIDE_REMINDER.subject={soon}: {subject}
RIDE_REMINDER.title={soon}: {subject}
RIDE_REMINDER.body=You are registered for this ride, which starts on {date}.
RIDE_REMINDER.cta=View the ride

RIDE_GROUP_REMOVED.subject=Group removed, {when}: {subject}
RIDE_GROUP_REMOVED.title=Group removed, {when}: {subject}
RIDE_GROUP_REMOVED.body=The group "{excerpt}" of the ride on {date} was removed, and your registration with it. You can join another group.
RIDE_GROUP_REMOVED.cta=View the ride

RIDE_UPDATED.subject=Ride changed: {subject}
RIDE_UPDATED.subject.DATE_TIME=New time, {when}: {subject}
RIDE_UPDATED.title=Ride changed: {subject}
RIDE_UPDATED.title.DATE_TIME=New time, {when}: {subject}
RIDE_UPDATED.body=This ride, which you are registered for, has changed: {changes}.
RIDE_UPDATED.cta=View the ride

RIDE_JOINED.subject={actor} joined {subject}, {when}
RIDE_JOINED.title=New rider, {when}: {subject}
RIDE_JOINED.body={actor} joined the "{excerpt}" group, which starts on {date}.
RIDE_JOINED.cta=View the ride

COMMENT_ON_MY_PUBLICATION.subject={actor} commented on "{subject}"
COMMENT_ON_MY_PUBLICATION.title=New comment
COMMENT_ON_MY_PUBLICATION.body={actor} commented on "{subject}": "{excerpt}"
COMMENT_ON_MY_PUBLICATION.cta=View the discussion

TEAM_INVITATION.subject={actor} invited you to {team}
TEAM_INVITATION.title=Invitation to {team}
TEAM_INVITATION.body={actor} invited you to join the team {team} on {site}.
TEAM_INVITATION.cta=View the invitation

CONTENT_REPORTED.subject=New report in {team}
CONTENT_REPORTED.title=New report in {team}
CONTENT_REPORTED.body=Content in the team {team} was reported and awaits your decision.
CONTENT_REPORTED.cta=View the reports

# The clauses of RIDE_UPDATED's {changes}, one per NotificationChange, joined by change.separator.
change.separator=;\u0020
change.DATE_TIME=it now takes place on {date}
change.START_PLACE=the meeting point has moved

# The zone mention of a {date}: see the French file (docs/LEDGER_*.md API-60).
zone.name={city} time
zone.date={date}, {zone}
zone.dateWithLocal={date}, {zone} ({local})
zone.local={time} your time

# {soon} when the rendezvous is today or tomorrow in its own zone: see the French file.
relative.today=Today {time}
relative.tomorrow=Tomorrow {time}

# The heading of a rendezvous: see the French file.
heading={when}: {subject}

# The frame of the daily digest e-mail. {count} is the number of notifications it holds.
digest.subject=Your digest: {count} notification(s)
digest.title=What you missed
digest.intro=Here are the notifications of the last 24 hours.

# The message a team administrator sends to check the team webhook.
webhook.test.title={team} webhook connected
webhook.test.body=Announcements of the team {team} on {site} will be posted here: published rides, trips and posts, cancellations and changes.
