# Server-rendered texts of the notifications: e-mail, push, team webhook. One block per
# NotificationType; NotificationTextsTest fails if a type is missing a key.
#
# Placeholders: {actor} {team} {subject} {date} {when} {soon} {excerpt} {site}, and {changes} for
# RIDE_UPDATED.
# {date} is the subject's rendezvous in its own zone, which it names when the reader's differs
# (zone.* below, docs/LEDGER_*.md API-60): never put a zone in a template around it. {when} is the
# same rendezvous without the zone mention, short enough for a title or a subject line (« sam. 12
# avr. · 09:00 », the year only when it is not the current one: docs/BRANDING.md §8.3). {soon} is
# {when} said relative to the moment the message leaves (relative.* below) — for the reminder only:
# every other text may be read later (digest, team webhook), so none says « demain ».
# A rendezvous' title leads with its date (ledger NOTIF-14): a folded notification or a locked
# screen cuts the rest. The body then says what happened, and does not repeat the name.
# {actor} falls back to {team} when nobody in particular caused the event, and always for the
# *_PUBLISHED types: a publication is signed by the team, never by its author. Plain text: the e-mail
# template escapes what it inserts. Read as UTF-8.
# A key suffixed .DATE_TIME replaces its plain one when the changes of a RIDE_UPDATED include the
# date.

RIDE_PUBLISHED.subject={when} : {subject}
RIDE_PUBLISHED.title={when} : {subject}
RIDE_PUBLISHED.body=Nouvelle sortie publiée par {actor}, départ le {date}.
RIDE_PUBLISHED.cta=Voir la sortie

RIDE_CANCELLED.subject=Annulée, {when} : {subject}
RIDE_CANCELLED.title=Annulée, {when} : {subject}
RIDE_CANCELLED.body=La sortie du {date}, à laquelle vous participiez, est annulée.
RIDE_CANCELLED.cta=Voir la sortie

TRIP_PUBLISHED.subject={when} : {subject}
TRIP_PUBLISHED.title={when} : {subject}
TRIP_PUBLISHED.body=Nouveau voyage publié par {actor}, départ le {date}.
TRIP_PUBLISHED.cta=Voir le voyage

TRIP_CANCELLED.subject=Annulé, {when} : {subject}
TRIP_CANCELLED.title=Annulé, {when} : {subject}
TRIP_CANCELLED.body=Le voyage du {date}, auquel vous participiez, est annulé.
TRIP_CANCELLED.cta=Voir le voyage

POST_PUBLISHED.subject=Nouvel article : {subject}
POST_PUBLISHED.title=Nouvel article dans {team}
POST_PUBLISHED.body={actor} a publié « {subject} ».
POST_PUBLISHED.cta=Lire l'article

COMMENT_REPLY.subject={actor} vous a répondu
COMMENT_REPLY.title=Nouvelle réponse
COMMENT_REPLY.body={actor} a répondu à votre commentaire sur « {subject} » : « {excerpt} »
COMMENT_REPLY.cta=Voir la discussion

RIDE_REMINDER.subject={soon} : {subject}
RIDE_REMINDER.title={soon} : {subject}
RIDE_REMINDER.body=Vous participez à cette sortie, qui part le {date}.
RIDE_REMINDER.cta=Voir la sortie

RIDE_GROUP_REMOVED.subject=Groupe retiré, {when} : {subject}
RIDE_GROUP_REMOVED.title=Groupe retiré, {when} : {subject}
RIDE_GROUP_REMOVED.body=Le groupe « {excerpt} » de la sortie du {date} a été retiré, et votre inscription avec lui. Vous pouvez rejoindre un autre groupe.
RIDE_GROUP_REMOVED.cta=Voir la sortie

RIDE_UPDATED.subject=Sortie modifiée : {subject}
RIDE_UPDATED.subject.DATE_TIME=Nouvel horaire, {when} : {subject}
RIDE_UPDATED.title=Sortie modifiée : {subject}
RIDE_UPDATED.title.DATE_TIME=Nouvel horaire, {when} : {subject}
RIDE_UPDATED.body=Cette sortie, à laquelle vous participez, a changé : {changes}.
RIDE_UPDATED.cta=Voir la sortie

RIDE_JOINED.subject={actor} a rejoint {subject}, {when}
RIDE_JOINED.title=Nouvelle inscription, {when} : {subject}
RIDE_JOINED.body={actor} a rejoint le groupe « {excerpt} », qui part le {date}.
RIDE_JOINED.cta=Voir la sortie

COMMENT_ON_MY_PUBLICATION.subject={actor} a commenté « {subject} »
COMMENT_ON_MY_PUBLICATION.title=Nouveau commentaire
COMMENT_ON_MY_PUBLICATION.body={actor} a commenté « {subject} » : « {excerpt} »
COMMENT_ON_MY_PUBLICATION.cta=Voir la discussion

TEAM_INVITATION.subject={actor} vous invite dans {team}
TEAM_INVITATION.title=Invitation dans {team}
TEAM_INVITATION.body={actor} vous invite à rejoindre l'équipe {team} sur {site}.
TEAM_INVITATION.cta=Voir l'invitation

CONTENT_REPORTED.subject=Nouveau signalement dans {team}
CONTENT_REPORTED.title=Nouveau signalement dans {team}
CONTENT_REPORTED.body=Un contenu de l'équipe {team} a été signalé et attend votre décision.
CONTENT_REPORTED.cta=Voir les signalements

# The clauses of RIDE_UPDATED's {changes}, one per NotificationChange, joined by change.separator.
change.separator= ;\u0020
change.DATE_TIME=elle aura lieu le {date}
change.START_PLACE=le point de départ n'est plus le même

# The zone mention of a {date} (docs/LEDGER_*.md API-60), as the web catalog's timezone.* keys:
# zone.name names the rendezvous' zone ({city}, or {ofCity}: « de Tokyo », « d'Athènes », « du
# Caire »); zone.date is a {date} for a reader without a zone, zone.dateWithLocal one for a reader
# with theirs, whose zone.local equivalent carries the short day when it changes (« ven. 01:00 »).
zone.name=heure {ofCity}
zone.date={date}, {zone}
zone.dateWithLocal={date}, {zone} ({local})
zone.local={time} chez vous

# {soon} when the rendezvous is today or tomorrow in its own zone ({time}: « 09:00 »); {when}
# otherwise. Capitalised: {soon} only ever opens a title.
relative.today=Aujourd'hui {time}
relative.tomorrow=Demain {time}

# The heading of a rendezvous, whatever its type: the bold line of a digest item and the start of
# an e-mail's preheader — read later, so absolute, the reminder's included.
heading={when} : {subject}

# The frame of the daily digest e-mail. {count} is the number of notifications it holds.
digest.subject=Votre résumé : {count} notification(s)
digest.title=Ce que vous avez manqué
digest.intro=Voici les notifications de ces dernières 24 heures.

# The message a team administrator sends to check the team webhook.
webhook.test.title=Webhook {team} branché
webhook.test.body=Les annonces de l'équipe {team} sur {site} arriveront ici : sorties, voyages et articles publiés, annulations et modifications.
