[versions]
agp = "9.4.1"
kotlin = "2.4.21"
karoo-ext = "1.1.9"
ktor = "3.6.0"
ktor-client-karoo = "1.0.1"
compose-bom = "2026.09.00"
core-ktx = "1.19.1"
lifecycle = "2.11.0"
activity-compose = "1.13.0"
datastore = "1.2.1"
zxing = "4.3.0"
kotlinx-serialization = "1.11.0"
ben-manes-versions = "0.66.0"
spotless = "8.10.4"

[libraries]
karoo-ext = { module = "io.hammerhead:karoo-ext", version.ref = "karoo-ext" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-karoo = { module = "de.jonasfranz:ktor-client-karoo", version.ref = "ktor-client-karoo" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
zxing = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "ben-manes-versions" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
