<!-- @dsCard group="Cartes" height=400 subtitle="Vignette, titre, deux statistiques, revêtement" -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte de parcours</title>
<style>
body{margin:0;padding:16px;background:var(--body);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.45}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font-size:12px;color:var(--text-dimmed);margin:0 0 6px}
.badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.25px;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:4px;color:var(--text-dimmed);font-size:14px}
.paper{background:var(--body);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;transition:box-shadow .2s,border-color .2s}
.paper:hover{box-shadow:var(--shadow-md)}
.h4{margin:0;font-size:18px;line-height:1.5;font-weight:700;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{color:var(--text-dimmed)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 18px;border-radius:var(--radius-md);font:600 14px/1 var(--font-sans);border:1px solid transparent;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover{background:var(--primary-hover)}
.btn-default{background:var(--body);color:var(--text);border-color:var(--border)}
.btn-default:hover{background:var(--surface-hover)}
.btn-subtle{background:transparent;color:var(--primary-on-soft)}
.btn-subtle:hover{background:var(--primary-soft)}
.btn-disabled{background:var(--disabled-bg);color:var(--disabled-text);border-color:var(--disabled-border);cursor:not-allowed}
.btn-danger{background:var(--danger);color:#ffffff}
.link-danger{color:var(--danger);font-size:14px;text-decoration:none;font-weight:500}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-pill);color:#ffffff;font-weight:700;flex:none}
.cluster{display:flex}
.cluster .av{width:26px;height:26px;font-size:10px;border:2px solid var(--body);margin-left:-4px}
.cluster .av:first-child{margin-left:0}
.more{background:var(--neutral-soft);color:var(--neutral-on-soft)!important}
.daybox{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:56px;padding:6px 0;border-radius:var(--radius-md);line-height:1.15}
.daybox .d{font-size:12px;font-weight:600;color:var(--primary-on-soft)}
.daybox .n{font-size:24px;font-weight:700;color:var(--text-bright)}
.daybox .m{font-size:12px;font-weight:500;color:var(--text)}
</style>
</head>
<body>
<article class="paper" style="width:320px"><div style="height:180px;background:var(--surface-hover);display:flex;align-items:center;justify-content:center;color:var(--text-dimmed)" aria-label="Vignette du parcours en chargement"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4z"/><path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5"/></svg></div><div style="padding:16px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;gap:12px"><div style="width:40px;height:40px;border-radius:var(--radius-md);background:var(--accent-violet);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none">VC</div><div style="min-width:0"><h4 class="h4">Tour des Monts d'Arrée</h4><p class="dim" style="margin:0;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">Une boucle vallonnée par le Roc'h Trevezel et le lac de Brennilis, deux longues montées.</p></div></div><div class="row" style="gap:16px"><span class="stat"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13"/><path d="M9 4v13"/><path d="M15 7v13"/></svg>68 km</span><span class="stat"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l0 14"/><path d="M18 11l-6 -6"/><path d="M6 11l6 -6"/></svg>1 240 m</span><span class="stat"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1"/></svg>3</span></div><div class="row"><span class="badge" style="background:var(--fam-orange-soft);color:var(--fam-orange-on-soft)">Gravel</span><span class="badge" style="background:var(--fam-blue-soft);color:var(--fam-blue-on-soft)">Public</span></div></div></article>
</body>
</html>
