<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Filtres</title>
<style>
body{margin:0;padding:16px;background:var(--body);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.45}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font-size:12px;color:var(--text-dimmed);margin:0 0 6px}
.badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 8px;border-radius:var(--radius-pill);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.25px;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:4px;color:var(--text-dimmed);font-size:14px}
.paper{background:var(--body);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;transition:box-shadow .2s,border-color .2s}
.paper:hover{box-shadow:var(--shadow-md)}
.h4{margin:0;font-size:18px;line-height:1.5;font-weight:700;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{color:var(--text-dimmed)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 18px;border-radius:var(--radius-md);font:600 14px/1 var(--font-sans);border:1px solid transparent;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover{background:var(--primary-hover)}
.btn-default{background:var(--body);color:var(--text);border-color:var(--border)}
.btn-default:hover{background:var(--surface-hover)}
.btn-subtle{background:transparent;color:var(--primary-on-soft)}
.btn-subtle:hover{background:var(--primary-soft)}
.btn-disabled{background:var(--disabled-bg);color:var(--disabled-text);border-color:var(--disabled-border);cursor:not-allowed}
.btn-danger{background:var(--danger);color:#ffffff}
.link-danger{color:var(--danger);font-size:14px;text-decoration:none;font-weight:500}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-pill);color:#ffffff;font-weight:700;flex:none}
.cluster{display:flex}
.cluster .av{width:26px;height:26px;font-size:10px;border:2px solid var(--body);margin-left:-4px}
.cluster .av:first-child{margin-left:0}
.more{background:var(--neutral-soft);color:var(--neutral-on-soft)!important}
.daybox{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:56px;padding:6px 0;border-radius:var(--radius-md);line-height:1.15}
.daybox .d{font-size:12px;font-weight:600;color:var(--primary-on-soft)}
.daybox .n{font-size:24px;font-weight:700;color:var(--text-bright)}
.daybox .m{font-size:12px;font-weight:500;color:var(--text)}
</style>
</head>
<body>
<div class="col"><div><p class="cap">Site : bouton « Filtres » actif et « Effacer les filtres »</p><div class="row"><button class="btn" aria-label="Filtres, 2 actifs" style="background:var(--primary-soft);color:var(--primary-on-soft)"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227z"/></svg>Filtres<span style="display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700">2</span><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button><button class="btn btn-subtle"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>Effacer les filtres</button><button class="btn btn-default"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227z"/></svg>Filtres<svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg></button></div></div><div><p class="cap">App : tri, filtres actifs, filtres disponibles</p><div class="row" style="gap:8px"><span style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radius-pill);font-size:14px;box-sizing:border-box;white-space:nowrap;border:1px solid var(--text);color:var(--text)"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l7 0"/><path d="M4 12l7 0"/><path d="M4 18l9 0"/><path d="M15 15l3 3l3 -3"/><path d="M18 6l0 12"/></svg>Date</span><span style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radius-pill);font-size:14px;box-sizing:border-box;white-space:nowrap;background:var(--primary-soft);color:var(--primary-on-soft);font-weight:600">Gravel<svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></span><span style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radius-pill);font-size:14px;box-sizing:border-box;white-space:nowrap;background:var(--primary-soft);color:var(--primary-on-soft);font-weight:600">Je participe<svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></span><span style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radius-pill);font-size:14px;box-sizing:border-box;white-space:nowrap;border:1px solid var(--border);color:var(--text-dimmed)">Relief</span><span style="display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radius-pill);font-size:14px;box-sizing:border-box;white-space:nowrap;border:1px solid var(--border);color:var(--text-dimmed)">Distance</span></div></div></div>
</body>
</html>
