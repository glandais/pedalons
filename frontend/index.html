<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="keywords" content="cycling, team, club, rides, routes, GPX, bike" />
    <meta name="author" content="Pédalons" />
    <meta name="theme-color" content="#228be6" />
    <!--
      Installable as an app. The manifest is served per domain by server.js (the app is named after
      the site); the per-domain iOS title (apple-mobile-web-app-title) comes with the SSR head below.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Per-route page title, robots directive and Open Graph / Twitter tags are emitted server-side (early in HEAD,
      within Slack's ~32KB / WhatsApp's ~300KB budgets) at the placeholder below. server.js injects
      the block built by src/lib/seo.ts and strips the static fallback title so exactly one, dynamic
      title survives. The static one below is a fallback for the JS-less dev SPA tab only (no SSR).
    -->
    <!--ssr-head-->
    <title>Pédalons</title>
    <!--
      Set data-mantine-color-scheme before first paint so SSR-shipped markup styles correctly.
      Mantine only defines CSS variables for the concrete "light"/"dark" values, so "auto" must be
      resolved to the OS preference here (mirroring @mantine/core's ColorSchemeScript). Writing the
      literal "auto" leaves every --mantine-color-* variable undefined → a flash of light styling
      until MantineProvider re-resolves it on hydration.

      server.js already sets this attribute on <html> for a signed-in visitor's explicit LIGHT/DARK
      preference (resolved server-side, not from this browser's storage) — skip re-deriving it from
      localStorage/matchMedia in that case, since those know nothing about that visitor and can
      briefly disagree with the SSR markup.
    -->
    <script>(function(){try{if(document.documentElement.getAttribute('data-mantine-color-scheme'))return;var s=localStorage.getItem('mantine-color-scheme-value')||'auto';if(s==='auto'){s=('matchMedia'in window&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-mantine-color-scheme',s);}catch(e){document.documentElement.setAttribute('data-mantine-color-scheme','light');}})();</script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <!--ssr-state-->
    <!--ssr-auth-->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
