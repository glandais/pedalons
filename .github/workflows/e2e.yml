name: E2E

# La suite Playwright (frontend/e2e/) contre la vraie application : images backend et frontend
# construites ici, pile tribly-e2e (docker-compose.yml + docker-compose.e2e.yml, .env.e2e) sur une
# base vide. La nuit sur develop et à la main, jamais sur les PR : trop longue pour bloquer une PR,
# et un test intermittent n'y bloquerait personne à tort (docs/LEDGER_*.md AUD-3).
on:
  schedule:
    # 02:17 UTC : hors de l'heure pile, que tous les dépôts se disputent.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Le routage passe par l'API Stadia Maps : la clé vient d'un secret du dépôt, jamais de .env.e2e
      # (committé). docker-compose.e2e.yml la transmet au backend ; le test du planificateur tourne
      # donc ici aussi. Secret absent : scripts/e2e.sh exporte E2E_NO_ROUTING=1 et le planificateur
      # est écarté par playwright.config.ts.
      STADIAMAPS_API_KEY: ${{ secrets.STADIAMAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Le seul verrou entre la suite et une vraie boîte aux lettres : le mailer du backend doit viser
      # mailpit, rien d'autre. Vérifié avant que quoi que ce soit démarre.
      - name: Mail goes to mailpit only
        run: |
          grep -qx 'QUARKUS_MAILER_HOST=mailpit' .env.e2e || {
            echo "::error file=.env.e2e::QUARKUS_MAILER_HOST must be mailpit"
            exit 1
          }
          grep -q 'env_file: !override' docker-compose.e2e.yml && grep -q -- '- .env.e2e' docker-compose.e2e.yml || {
            echo "::error file=docker-compose.e2e.yml::the backend must read .env.e2e only"
            exit 1
          }

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the tribly-e2e images
        run: scripts/e2e.sh build all

      # Le backend tourne en PUID:PGID (1000, .env.e2e) et écrit dans .e2e/storage et .e2e/cache ;
      # l'utilisateur du runner n'est pas 1000. Créés et cédés ici, e2e.sh les trouve prêts et les
      # garde (il ne génère la paire JWT que si elle manque).
      - name: Prepare the stack's state
        run: |
          mkdir -p .e2e/keys .e2e/storage .e2e/cache
          openssl genrsa -out .e2e/keys/privateKey.pem 2048
          openssl rsa -in .e2e/keys/privateKey.pem -pubout -out .e2e/keys/publicKey.pem
          chmod 600 .e2e/keys/privateKey.pem
          sudo chown -R 1000:1000 .e2e

      - name: Start the stack
        run: scripts/e2e.sh up

      - name: Run the suite
        run: scripts/e2e.sh test

      - name: Stack logs
        if: failure()
        run: scripts/e2e.sh compose --profile app logs --no-color --timestamps > e2e-stack.log

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
            e2e-stack.log
          retention-days: 14
