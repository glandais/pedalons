name: Mobile APK Release

# A signed APK of the mobile app for Android devices without Google Play Services, outside the Play
# Store. mobile/publish_beta.sh pushes the tag mobile.X.Y.Z.N once its uploads went through and its
# build-number bump is committed, so this builds exactly the commit sent to the beta testers.
on:
  push:
    tags: ['mobile.*']

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag repeats pubspec.yaml's version (« + » turned into « . »): a tag pushed by hand on
      # the wrong commit would publish an APK whose versionCode lies about its content.
      - name: Check the tag against pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -E '^version:' mobile/pubspec.yaml | awk '{print $2}')
          EXPECTED="mobile.${VERSION/+/.}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, mais pubspec.yaml est en $VERSION (tag attendu : $EXPECTED)"
            exit 1
          fi
          echo "name=${VERSION%+*}" >> "$GITHUB_OUTPUT"

      # Before the build, so a release without its notes fails in seconds: the version's App Store
      # whatsNew, French then English, as the release body.
      - name: Read whatsNew
        run: |
          dir="mobile/metadata/version/${{ steps.version.outputs.name }}"
          for l in fr-FR en-US; do
            test -f "$dir/$l.json" || { echo "::error::whatsNew manquant : $dir/$l.json"; exit 1; }
          done
          { jq -r .whatsNew "$dir/fr-FR.json"; echo; jq -r .whatsNew "$dir/en-US.json"; } > mobile/release-notes.md

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run code generation
        working-directory: ./mobile
        run: dart run build_runner build

      # The Karoo key, not Play's upload key: Play App Signing re-signs what the Store serves, so
      # this APK never updates a Play install (nor the reverse) whichever key signs it, and the upload
      # key stays out of GitHub. Keep it for good: another key breaks every APK install's updates.
      - name: Decode keystore
        working-directory: ./mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KAROO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write key.properties
        working-directory: ./mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KAROO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAROO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAROO_KEY_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storeFile=$(pwd)/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # One universal APK: a single link to give, whatever the device's ABI.
      - name: Build signed release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Clean up keystore
        if: always()
        working-directory: ./mobile/android
        run: rm -f release.keystore key.properties

      # Without key.properties, build.gradle.kts silently falls back to the debug key: fail rather
      # than publish an APK signed by a key nobody keeps.
      - name: Check the signature
        working-directory: ./mobile
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk pedalons-android.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERTS=$("$APKSIGNER" verify --print-certs pedalons-android.apk)
          echo "$CERTS"
          if echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::error::APK signé avec la clé de debug"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Pédalons Android ${{ steps.version.outputs.name }} (${{ github.ref_name }})
          body_path: mobile/release-notes.md
          files: mobile/pedalons-android.apk
          # "Latest" is no link's target; leave it to whatever holds it.
          make_latest: false

      # The stable URL of the site's and the mobile app's « APK sans Google Play » buttons (frontend
      # AppsPage, mobile apps_page.dart). Never "Latest", never deleted; its asset is rewritten in
      # place, which requires the repository's immutable releases to stay off. The tag does not
      # match `mobile.*`, and a tag pushed with GITHUB_TOKEN triggers no workflow anyway.
      - name: Update the mobile-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-latest >/dev/null 2>&1 ||
            gh release create mobile-latest --target "$GITHUB_SHA" --latest=false \
              --title "Android sans Google Play — APK courant" \
              --notes "Pointeur vers le dernier APK Android hors Play (mobile/publish_beta.sh). Ne pas supprimer."
          gh release upload mobile-latest mobile/pedalons-android.apk --clobber
