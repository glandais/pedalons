name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Lecture seule par défaut ; un job qui a besoin de plus le déclare lui-même.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      karoo: ${{ steps.filter.outputs.karoo }}
      dependency-graph: ${{ steps.filter.outputs.dependency-graph }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: develop
          filters: |
            backend:
              - 'backend/**'
              - 'pom.xml'
            frontend:
              - 'frontend/**'
              - 'contracts/**'
            mobile:
              - 'mobile/**'
            karoo:
              - 'karoo/**'
            dependency-graph:
              - 'backend/pom.xml'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend (skip tests)
        working-directory: ./backend
        run: mvn -B clean verify -DskipTests

      - name: Generate JWT keys for tests
        run: |
          mkdir -p backend/keys
          openssl genrsa -out backend/keys/privateKey.pem 2048
          openssl rsa -in backend/keys/privateKey.pem -pubout -out backend/keys/publicKey.pem

      - name: Run backend tests
        working-directory: ./backend
        env:
          QUARKUS_HIBERNATE_ORM_LOG_SQL: 'false'
        run: mvn -B test

  # Publie l'arbre Maven réellement résolu dans le dependency graph de GitHub.
  # Sans lui, le graphe repose sur une analyse statique du pom qui résout mal
  # les versions imposées par quarkus-bom : les alertes Dependabot visent des
  # versions périmées et les security updates échouent en dependency_not_found.
  backend-dependency-graph:
    name: Backend dependency graph
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.dependency-graph == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Submit Maven dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v6.0.1
        with:
          directory: backend

  frontend:
    name: Frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version the frontend image runs (frontend/Dockerfile), kept in frontend/.nvmrc.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: pnpm run lint

      - name: Translation catalogues
        working-directory: ./frontend
        run: pnpm run i18n:check

      - name: Type check
        working-directory: ./frontend
        run: pnpm run typecheck

      - name: Build
        working-directory: ./frontend
        run: pnpm run build

      - name: Run tests
        working-directory: ./frontend
        run: pnpm test run

  mobile:
    name: Mobile (Flutter)
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run code generation
        working-directory: ./mobile
        run: dart run build_runner build

      - name: Analyze
        working-directory: ./mobile
        run: flutter analyze

      - name: Run tests
        working-directory: ./mobile
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found, skipping tests"
          fi

      - name: Build Android app bundle
        working-directory: ./mobile
        run: flutter build appbundle --release

  mobile-ios:
    name: Mobile (iOS build)
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Run code generation
        working-directory: ./mobile
        run: dart run build_runner build

      - name: Build iOS app (unsigned)
        working-directory: ./mobile
        run: flutter build ios --release --no-codesign

  karoo:
    name: Karoo Extension
    needs: [changes]
    if: needs.changes.outputs.karoo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Karoo extension
        working-directory: ./karoo
        env:
          USERNAME: ${{ secrets.GPR_USER }}
          TOKEN: ${{ secrets.GPR_KEY }}
        run: ./gradlew assembleDebug

  # Garmin Connect IQ : exclu du CI
  # Le SDK Connect IQ nécessite un SDK Manager GUI et ne peut pas être
  # facilement automatisé. Pour l'ajouter, envisager :
  #   1. Publier une image Docker avec le SDK pré-installé
  #   2. Utiliser le cache d'artifacts GitHub Actions pour le SDK
  #   3. Trouver une action communautaire pour les builds Connect IQ
