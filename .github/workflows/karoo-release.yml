name: Karoo Release

on:
  push:
    tags: ['karoo.*']

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#karoo.}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # Before the build, so a release without its notes fails in seconds. The same text, French
      # then English (the manifest has no locale, and the Karoo may be set to either), is the
      # GitHub release body and the manifest's releaseNotes, shown on the Karoo.
      - name: Read whatsNew
        run: |
          dir="karoo/metadata/version/${{ steps.version.outputs.name }}"
          for l in fr-FR en-US; do
            test -f "$dir/$l.json" || { echo "::error::whatsNew manquant : $dir/$l.json"; exit 1; }
          done
          { jq -r .whatsNew "$dir/fr-FR.json"; echo; jq -r .whatsNew "$dir/en-US.json"; } > karoo/release-notes.md

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        working-directory: ./karoo
        env:
          KEYSTORE_BASE64: ${{ secrets.KAROO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Write keystore.properties
        working-directory: ./karoo
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KAROO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAROO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAROO_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: ./karoo
        env:
          USERNAME: ${{ secrets.GPR_USER }}
          TOKEN: ${{ secrets.GPR_KEY }}
          KAROO_VERSION_NAME: ${{ steps.version.outputs.name }}
          KAROO_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease

      - name: Clean up keystore
        if: always()
        working-directory: ./karoo
        run: rm -f release.keystore keystore.properties

      - name: Collect release assets
        working-directory: ./karoo
        run: |
          cp app/build/outputs/apk/release/app-release.apk pedalons.apk
          cp ../frontend/public/pwa-512x512.png pedalons.png
          for f in $(jq -r '.screenshots[]' metadata/app.json); do
            cp "metadata/screenshots/$f" "screenshot-$f"
          done

      # karoo-ext's KarooAppManifest. Its URLs are pinned to this tag: the manifest of release N
      # always names exactly APK N, whichever release is "Latest" in this monorepo. app.json's
      # `screenshots` (files of metadata/screenshots/, in display order) becomes screenshotUrls.
      - name: Generate Karoo manifest
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          jq --arg v "$NAME" --argjson c "$CODE" --arg base "$BASE" \
             --rawfile notes karoo/release-notes.md \
             'del(.screenshots) + {
               iconUrl: "\($base)/pedalons.png",
               screenshotUrls: [.screenshots[] | "\($base)/screenshot-\(.)"],
               latestApkUrl: "\($base)/pedalons.apk",
               latestVersion: $v,
               latestVersionCode: $c,
               releaseNotes: ($notes | rtrimstr("\n"))
             }' karoo/metadata/app.json > karoo/manifest.json
          cat karoo/manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: karoo/release-notes.md
          files: |
            karoo/pedalons.apk
            karoo/pedalons.png
            karoo/screenshot-*.png
            karoo/manifest.json

      # The stable URLs: every APK's MANIFEST_URL (https://www.pedalons.fr/karoo/manifest.json)
      # redirects to its manifest.json, and the site's and the mobile app's install buttons
      # (frontend AppsPage, mobile apps_page.dart) point at its pedalons.apk. Never "Latest", never deleted; its assets are rewritten in place, which
      # requires the repository's immutable releases to stay off. The tag does not match `karoo.*`,
      # and a tag pushed with GITHUB_TOKEN triggers no workflow anyway.
      - name: Update the karoo-latest manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view karoo-latest >/dev/null 2>&1 ||
            gh release create karoo-latest --target "$GITHUB_SHA" --latest=false \
              --title "Karoo — manifest courant" \
              --notes "Pointeur vers la dernière version Karoo (karoo/PUBLISH.md). Ne pas supprimer."
          gh release upload karoo-latest karoo/manifest.json karoo/pedalons.apk --clobber
