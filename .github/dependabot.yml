version: 2
updates:
  # Maven dependencies (Backend)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(maven)"
      include: "scope"
    ignore:
      # Spotless calls JavaFormatterOptions.Style.valueOf, gone in 1.37.0 (Style became a record):
      # every file fails with InvocationTargetException. Fixed upstream (diffplug/spotless#3126,
      # google/google-java-format a51e46a), not yet released — drop this once 1.37.1 is out.
      - dependency-name: "com.google.googlejavaformat:google-java-format"
        versions: ["1.37.0"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # npm dependencies (Frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Gradle dependencies (Karoo Extension)
  - package-ecosystem: "gradle"
    directory: "/karoo"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(gradle)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Gradle dependencies (Mobile Android)
  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(gradle)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Dart/Flutter dependencies (Mobile)
  - package-ecosystem: "pub"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(pub)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Bundler dependencies (fastlane — mobile release tooling)
  - package-ecosystem: "bundler"
    directories:
      - "/mobile/android"
      - "/mobile/ios"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(bundler)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker dependencies (Frontend, Garmin build images)
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/garmin-app"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    ignore:
      # The Garmin build images sit on an Ubuntu LTS the Connect IQ SDK is known to run on: a new
      # LTS is a deliberate move, tested by hand, not a weekly bump. Ignored outright, since
      # 22.04 → 22.10 (a short-lived interim release) counts as a minor update. The LTS tag itself
      # is rebuilt upstream with security fixes, so nothing is frozen.
      - dependency-name: "ubuntu"

  # Docker Compose dependencies (root, Gatus — Dependabot does not recurse into subdirectories)
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/services/monitoring/gatus"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(docker-compose)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "glandais"
    commit-message:
      prefix: "deps(github-actions)"
      include: "scope"
