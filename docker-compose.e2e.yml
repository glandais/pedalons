# End-to-end test overlay for docker-compose.yml. Driven by scripts/e2e.sh, which passes both files,
# `--env-file .env.e2e` and the project name explicitly — never started by a bare `docker compose`.
#
# What it changes, and why:
#
#   1. No bind mount into ./data. The workstation stack owns data/storage and data/cache.
#      Storage, cache and JWT keys live under .e2e/ instead, which e2e.sh
#      creates as the invoking user (the backend runs as PUID; a named volume would start root-owned)
#      and `e2e.sh reset` empties.
#   2. The backend reads .env.e2e, not the .env next to it — which may be a real one.
#   3. mailpit, publishing only its HTTP API: the tests read OTP codes and verification links there.
#   4. tileserver is not run: the `shared` network is the workstation stack's, joined from outside
#      (E2E_SHARED_NETWORK). Routing goes to the Stadia Maps API: STADIAMAPS_API_KEY is taken from
#      the shell's environment (scripts/e2e.sh reads it from the workstation's .env, the CI from a
#      secret), never from .env.e2e, which is committed and holds no key.
#   5. what docker-compose.local.yml turns back on a workstation, since docker-compose.yml is written
#      for Swarm: traefik's Docker provider and loopback port, postgres published on the loopback,
#      a bridge network instead of an overlay. Not by layering docker-compose.local.yml, whose
#      mailpit, tileserver and fixed dev ports would clash with the workstation stack.
#   6. an osm-route-details of its own (docs/LEDGER_*.md API-150): every saved route, import and
#      straight line reads its elevations there, so unlike tileserver it cannot be borrowed from a
#      stack that may be down, and the CI has none to borrow. Only on `pedalons`: on `shared` the bare
#      name is the workstation's container, hence the container name in OSM_ROUTE_DETAILS_URL. No
#      published port (only the backend calls it, and 18003 stays the workstation's), a named volume
#      rather than .e2e/cache (the image runs as 65532 and owns its VOLUME; a directory e2e.sh created
#      would not be writable by it), emptied by `e2e.sh reset`. .env.e2e keeps the HD catch-up out of
#      a run, so the suite only ever asks for `fast` and never reads the IGN.
services:
  backend:
    env_file: !override
      - .env.e2e
    # Compose interpolation from the shell, not from .env.e2e (see 4. above). Empty when unset: the
    # backend then answers every routing request with an error, and playwright.config.ts skips the
    # planner test when E2E_NO_ROUTING is set.
    environment:
      STADIAMAPS_API_KEY: ${STADIAMAPS_API_KEY:-}
    volumes: !override
      - ./.e2e/storage:/mnt/storage
      - ./.e2e/keys:/mnt/keys:ro
      - ./.e2e/cache:/mnt/cache

  traefik:
    ports: !override
      - "127.0.0.1:${HTTP_PORT:?set it in .env.e2e}:80"
    # docker-compose.local.yml's command: the Docker provider in place of the Swarm one.
    command: !override
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--log.level=WARN"
      - "--accesslog=false"
      - "--ping=true"
      - "--providers.docker.constraints=Label(`traefik.stack`,`${ENV_NAME}`)"
      - "--providers.docker.network=${ENV_NAME}-net"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?set it in .env.e2e}:5432"

  # Web analytics is not part of this stack: behind a profile e2e.sh never enables, and .env.e2e sets
  # no PEDALONS_ANALYTICS_COUNT_PATH, so the site counts nothing.
  goatcounter:
    profiles: [analytics]

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: ${ENV_NAME}-mailpit
    restart: unless-stopped
    networks:
      - pedalons
    ports:
      - "127.0.0.1:${E2E_MAILPIT_PORT:?set it in .env.e2e}:8025"

  osm-route-details:
    extends:
      file: docker-compose.shared.yml
      service: osm-route-details
    container_name: ${ENV_NAME}-osm-route-details
    restart: unless-stopped
    # Nothing to wait for here: the shared stack's 100 s are for a `full` call in flight.
    stop_grace_period: 10s
    networks: !override
      - pedalons
    # A short suite on a workstation that also runs tribly-local: the shared stack's 256 MB would
    # stay resident for a handful of tiles.
    environment:
      ORD_CACHE__MEMORY_ELEVATION_MB: "64"
      ORD_CACHE__MEMORY_STREETS_MB: "64"

volumes:
  osm-route-details-data:

networks:
  pedalons:
    driver: !reset null
  shared:
    name: ${E2E_SHARED_NETWORK:?set it in .env.e2e}
    external: true
